<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 轉影片封裝助手 (離線增強版)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // --- Icons (UI 元件) ---
        const IconMusic = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>);
        const IconImage = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></svg>);
        const IconVideo = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m22 8-6 4 6 4V8Z" /><rect width="14" height="12" x="2" y="6" rx="2" ry="2" /></svg>);
        const IconCheckCircle = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>);
        const IconLoader2 = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`animate-spin ${className}`}><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>);
        const IconDownload = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" /></svg>);
        const IconAlertCircle = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></svg>);
        const IconRefreshCw = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M3 21v-5h5" /></svg>);
        const IconUpload = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>);
        const IconGithub = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>);

        // v0.9.8 是唯一不需要 SharedArrayBuffer 的穩定版本
        
        // 核心檔案 CDN 列表
        const CDN_LIST = [
          {
            name: "Cloudflare (推薦)",
            main: "https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.9.8/ffmpeg.min.js",
            coreJs: "https://cdnjs.cloudflare.com/ajax/libs/ffmpeg-core/0.9.8/ffmpeg-core.js",
            coreWasm: "https://cdnjs.cloudflare.com/ajax/libs/ffmpeg-core/0.9.8/ffmpeg-core.wasm"
          },
          {
            name: "jsDelivr",
            main: "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.9.8/dist/ffmpeg.min.js",
            coreJs: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.9.8/dist/ffmpeg-core.js",
            coreWasm: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.9.8/dist/ffmpeg-core.wasm"
          },
          {
            name: "Unpkg",
            main: "https://unpkg.com/@ffmpeg/ffmpeg@0.9.8/dist/ffmpeg.min.js",
            coreJs: "https://unpkg.com/@ffmpeg/core@0.9.8/dist/ffmpeg-core.js",
            coreWasm: "https://unpkg.com/@ffmpeg/core@0.9.8/dist/ffmpeg-core.wasm"
          }
        ];

        // 本地檔案路徑 (GitHub Pages)
        const LOCAL_JS = "./ffmpeg-core.js";
        const LOCAL_WASM = "./ffmpeg-core.wasm";

        function App() {
          const [loaded, setLoaded] = useState(false);
          const [loadingMsg, setLoadingMsg] = useState('初始化...');
          const [audioFile, setAudioFile] = useState(null);
          const [imageFile, setImageFile] = useState(null);
          const [previewUrl, setPreviewUrl] = useState(null);
          const [isProcessing, setIsProcessing] = useState(false);
          const [progress, setProgress] = useState(0);
          const [outputUrl, setOutputUrl] = useState(null);
          const [error, setError] = useState(null);
          const [manualMode, setManualMode] = useState(false);
          const [loadSource, setLoadSource] = useState('');
          const [warningMsg, setWarningMsg] = useState('');
          
          const [manualCoreJs, setManualCoreJs] = useState(null);
          const [manualCoreWasm, setManualCoreWasm] = useState(null);

          const ffmpegRef = useRef(null);

          // 載入 Main Script
          const loadMainScript = (src) => {
            return new Promise((resolve, reject) => {
              if (window.FFmpeg) { resolve(); return; }
              const script = document.createElement('script');
              script.src = src;
              script.async = true;
              script.crossOrigin = "anonymous";
              script.onload = () => {
                  if (window.FFmpeg) resolve();
                  else reject(new Error('Script loaded but FFmpeg global not found'));
              };
              script.onerror = () => {
                  script.remove(); // 失敗時移除 DOM
                  reject(new Error(`Script load failed: ${src}`));
              };
              document.body.appendChild(script);
            });
          };

          // 嘗試從所有 CDN 列表中載入主程式 (ffmpeg.min.js)
          const ensureMainScriptLoaded = async () => {
              if (window.FFmpeg) return;

              for (const cdn of CDN_LIST) {
                  try {
                      console.log(`Trying to load main script from ${cdn.name}...`);
                      await loadMainScript(cdn.main);
                      console.log(`Main script loaded from ${cdn.name}`);
                      return; // 成功就退出
                  } catch (e) {
                      console.warn(`Failed to load main script from ${cdn.name}`, e);
                  }
              }
              throw new Error("無法載入 FFmpeg 主程式 (所有 CDN 皆失敗)");
          };

          // 下載工具 (XHR)
          const downloadAsText = (url) => {
            return new Promise((resolve, reject) => {
              const xhr = new XMLHttpRequest();
              xhr.open('GET', url, true);
              xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText);
                else reject(new Error(`HTTP ${xhr.status} for ${url}`));
              };
              xhr.onerror = () => reject(new Error('Network Error'));
              xhr.send();
            });
          };

          const downloadAsBlob = (url) => {
            return new Promise((resolve, reject) => {
              const xhr = new XMLHttpRequest();
              xhr.open('GET', url, true);
              xhr.responseType = 'blob';
              xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.response);
                else reject(new Error(`HTTP ${xhr.status} for ${url}`));
              };
              xhr.onerror = () => reject(new Error('Network Error'));
              xhr.send();
            });
          };

          // 核心初始化邏輯 (使用 Blob 注入)
          const initFFmpegWithBlob = async (coreJsContent, wasmBlob, sourceName) => {
             try {
                // 步驟 1: 確保主程式已載入
                setLoadingMsg('載入主程式...');
                await ensureMainScriptLoaded();

                setLoadingMsg(`啟動引擎 (${sourceName})...`);
                const { createFFmpeg } = window.FFmpeg;

                const wasmUrl = URL.createObjectURL(wasmBlob);
                
                // 替換 JS 內的 WASM 路徑 (針對 v0.9.8)
                let modifiedJs = coreJsContent;
                if (modifiedJs.includes('ffmpeg-core.wasm')) {
                   modifiedJs = modifiedJs.replace(/ffmpeg-core\.wasm/g, wasmUrl);
                }
                
                const coreJsBlob = new Blob([modifiedJs], { type: 'application/javascript' });
                const coreJsUrl = URL.createObjectURL(coreJsBlob);

                // v0.9.8: progress callback 在 config 中傳入
                const ffmpeg = createFFmpeg({
                  log: true,
                  corePath: coreJsUrl,
                  progress: ({ ratio }) => {
                    setProgress(Math.min(Math.max(Math.round(ratio * 100), 0), 100));
                  }
                });
                
                ffmpegRef.current = ffmpeg;

                await ffmpeg.load();
                setLoaded(true);
                setLoadSource(sourceName);
                setError(null);
                setManualMode(false);

             } catch (err) {
                console.error(err);
                throw new Error(err.message || 'Engine Init Failed');
             }
          };

          // 輪詢 CDN 載入核心
          const tryLoadFromCdn = async (cdnIndex) => {
             if (cdnIndex >= CDN_LIST.length) {
                throw new Error("所有下載來源皆失敗");
             }

             const cdn = CDN_LIST[cdnIndex];
             try {
                setLoadingMsg(`嘗試 ${cdn.name}...`);
                
                // 1. 下載核心檔案
                const [jsContent, wasmBlob] = await Promise.all([
                   downloadAsText(cdn.coreJs),
                   downloadAsBlob(cdn.coreWasm)
                ]);

                // 2. 初始化
                await initFFmpegWithBlob(jsContent, wasmBlob, cdn.name);
                return;

             } catch (e) {
                console.warn(`${cdn.name} failed:`, e);
                await tryLoadFromCdn(cdnIndex + 1);
             }
          };

          const autoLoad = async () => {
             // 1. 嘗試本地載入
             try {
                setLoadingMsg('偵測 GitHub / 本地檔案...');
                const jsContent = await downloadAsText(LOCAL_JS);
                const wasmBlob = await downloadAsBlob(LOCAL_WASM);
                
                await initFFmpegWithBlob(jsContent, wasmBlob, 'GitHub/Local');
                return; 
             } catch (e) {
                console.log("Local load failed:", e);
                // 本地失敗不視為致命錯誤，繼續嘗試 CDN
             }

             // 2. 啟動 CDN 輪詢
             try {
                await tryLoadFromCdn(0);
             } catch (e) {
                console.warn("Auto-load failed, switching to manual mode.");
                setManualMode(true); // 靜默切換到手動模式，不報錯
             }
          };

          useEffect(() => {
             autoLoad();
             return () => {
               if (previewUrl) URL.revokeObjectURL(previewUrl);
               if (outputUrl) URL.revokeObjectURL(outputUrl);
             };
          }, []);

          const handleManualLoad = async () => {
             if (!manualCoreJs || !manualCoreWasm) {
                alert('請先選擇兩個檔案！');
                return;
             }
             setLoadingMsg('讀取本地檔案...');
             try {
                // 手動模式也要確保主程式載入
                await ensureMainScriptLoaded();
                
                const jsText = await manualCoreJs.text();
                await initFFmpegWithBlob(jsText, manualCoreWasm, 'Manual Upload');
             } catch (e) {
                setError('載入失敗: ' + e.message);
             }
          };

          // 轉換邏輯
          const convertToVideo = async () => {
            if (!audioFile || !loaded) return;
            setIsProcessing(true);
            setProgress(0);
            setError(null);

            const ffmpeg = ffmpegRef.current;
            const { fetchFile } = window.FFmpeg; 
            
            try {
              ffmpeg.FS('writeFile', 'audio.mp3', await fetchFile(audioFile));
              if (imageFile) {
                ffmpeg.FS('writeFile', 'cover.png', await fetchFile(imageFile));
              } else {
                const blackBlob = await generateBlackImageBlob();
                ffmpeg.FS('writeFile', 'cover.png', await fetchFile(blackBlob));
              }

              await ffmpeg.run('-loop', '1', '-r', '1', '-i', 'cover.png', '-i', 'audio.mp3', '-c:v', 'libx264', '-preset', 'ultrafast', '-tune', 'stillimage', '-c:a', 'copy', '-shortest', '-pix_fmt', 'yuv420p', '-vf', 'scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2', 'output.mp4');

              const data = ffmpeg.FS('readFile', 'output.mp4');
              const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
              setOutputUrl(url);
            } catch (err) {
              console.error(err);
              setError('轉換失敗。請檢查檔案格式。');
            } finally {
              setIsProcessing(false);
              try { ffmpeg.FS('unlink', 'audio.mp3'); ffmpeg.FS('unlink', 'cover.png'); ffmpeg.FS('unlink', 'output.mp4'); } catch (e) {}
            }
          };

          const handleAudioChange = (e) => {
            const file = e.target.files?.[0];
            if (file) { setAudioFile(file); if(outputUrl) URL.revokeObjectURL(outputUrl); setOutputUrl(null); setError(null); }
          };
          const handleImageChange = (e) => {
            const file = e.target.files?.[0];
            if (file) { setImageFile(file); if(previewUrl) URL.revokeObjectURL(previewUrl); setPreviewUrl(URL.createObjectURL(file)); if(outputUrl) URL.revokeObjectURL(outputUrl); setOutputUrl(null); }
          };
          const handleReset = () => {
            setAudioFile(null); setImageFile(null); if(previewUrl) URL.revokeObjectURL(previewUrl); setPreviewUrl(null); if(outputUrl) URL.revokeObjectURL(outputUrl); setOutputUrl(null); setError(null); setProgress(0);
          };
          const generateBlackImageBlob = async () => {
            const canvas = document.createElement('canvas'); canvas.width = 1280; canvas.height = 720;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#333333'; ctx.font = 'bold 48px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Audio Only', canvas.width/2, canvas.height/2);
            return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
          };

          if (!loaded) {
            return (
              <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50 relative p-4">
                <div className="p-12 bg-white rounded-[3rem] shadow-xl flex flex-col items-center animate-zoom-in max-w-lg w-full text-center">
                  {!manualMode ? (
                    <>
                      <IconLoader2 className="w-16 h-16 text-blue-600 mb-6" />
                      <p className="text-slate-800 font-black text-xl animate-pulse">{loadingMsg}</p>
                      <p className="text-slate-400 text-sm mt-2">
                        正在掃描核心檔案...<br/>
                        <span className="text-xs opacity-70">(優先讀取本地 v0.9.8)</span>
                      </p>
                    </>
                  ) : (
                    <div className="w-full space-y-6">
                      <div className="bg-amber-50 p-4 rounded-2xl border border-amber-100 mb-4 text-left">
                        <h3 className="text-amber-800 font-bold text-lg mb-2 flex items-center gap-2">
                          <IconGithub className="w-5 h-5"/> 手動救援模式
                        </h3>
                        <p className="text-amber-700 text-xs leading-relaxed">
                          <strong>狀態：</strong>您的網路完全阻擋了雲端下載。<br/>
                          <strong>解決：</strong>請下載下方檔案，並在此「手動選取」它們。程式將會離線運作。
                        </p>
                      </div>

                      <div className="grid grid-cols-2 gap-4 text-xs">
                        <a href={CDN_LIST[1].coreJs} download className="bg-slate-100 hover:bg-slate-200 p-3 rounded-xl flex items-center justify-center gap-2 font-bold text-blue-600">
                          <IconDownload className="w-4 h-4"/> 1. 下載 JS (v0.9.8)
                        </a>
                        <a href={CDN_LIST[1].coreWasm} download className="bg-slate-100 hover:bg-slate-200 p-3 rounded-xl flex items-center justify-center gap-2 font-bold text-blue-600">
                          <IconDownload className="w-4 h-4"/> 2. 下載 WASM (v0.9.8)
                        </a>
                      </div>

                      <div className="space-y-4">
                        <p className="text-xs text-slate-400 font-bold uppercase tracking-widest text-left pl-1">請上傳剛下載的檔案：</p>
                        <div className="border-2 border-dashed border-slate-200 rounded-xl p-4 relative group hover:border-blue-400 transition-colors">
                          <input type="file" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" 
                            accept=".js" onChange={(e) => setManualCoreJs(e.target.files[0])} />
                          <div className="flex items-center gap-3">
                            <span className="bg-blue-100 text-blue-600 p-2 rounded-lg"><IconUpload className="w-5 h-5"/></span>
                            <div className="text-left">
                              <p className="font-bold text-slate-700">ffmpeg-core.js</p>
                              <p className="text-xs text-slate-400">{manualCoreJs ? manualCoreJs.name : '尚未選擇'}</p>
                            </div>
                          </div>
                        </div>

                        <div className="border-2 border-dashed border-slate-200 rounded-xl p-4 relative group hover:border-blue-400 transition-colors">
                          <input type="file" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" 
                            accept=".wasm" onChange={(e) => setManualCoreWasm(e.target.files[0])} />
                          <div className="flex items-center gap-3">
                            <span className="bg-indigo-100 text-indigo-600 p-2 rounded-lg"><IconUpload className="w-5 h-5"/></span>
                            <div className="text-left">
                              <p className="font-bold text-slate-700">ffmpeg-core.wasm</p>
                              <p className="text-xs text-slate-400">{manualCoreWasm ? manualCoreWasm.name : '尚未選擇'}</p>
                            </div>
                          </div>
                        </div>
                      </div>

                      <button 
                        onClick={handleManualLoad}
                        disabled={!manualCoreJs || !manualCoreWasm}
                        className="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-black transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                      >
                        <IconRefreshCw className="w-4 h-4" /> 啟動轉檔引擎
                      </button>
                    </div>
                  )}
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-slate-50 py-12 px-4 font-sans antialiased text-slate-900">
              <div className="max-w-2xl mx-auto">
                <div className="bg-white rounded-[2.5rem] shadow-[0_35px_60px_-15px_rgba(0,0,0,0.1)] overflow-hidden border border-white">
                  
                  {/* Header */}
                  <div className="bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 p-10 text-white relative overflow-hidden">
                    <div className="absolute top-0 right-0 p-4 opacity-10 transform translate-x-10 -translate-y-10">
                      <IconVideo className="w-64 h-64" />
                    </div>
                    <div className="relative z-10">
                      <h1 className="text-3xl font-black flex items-center gap-3 tracking-tighter">
                        <IconVideo className="text-blue-400 w-8 h-8" /> MP3 影片封裝助手
                      </h1>
                      <div className="flex items-center gap-3 mt-2">
                        <p className="text-blue-200/60 text-sm font-medium tracking-wide pl-1">
                          v0.9.8 • {loadSource || (manualMode ? '手動模式' : '初始化...')}
                        </p>
                      </div>
                    </div>
                  </div>

                  <div className="p-10 space-y-8">
                    {/* Warning Msg */}
                    {warningMsg && !error && (
                      <div className="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-2xl text-amber-700 text-sm mb-4 animate-fade-in">
                        <strong>提示：</strong>{warningMsg}
                      </div>
                    )}

                    {/* Error Msg */}
                    {error && (
                      <div className="bg-red-50 border-l-4 border-red-500 p-5 rounded-r-2xl flex items-start gap-4 animate-fade-in-down">
                        <IconAlertCircle className="text-red-500 shrink-0 mt-0.5" />
                        <div className="flex-1">
                          <h3 className="text-red-800 font-bold text-sm mb-1">發生錯誤</h3>
                          <p className="text-red-700 text-sm">{error}</p>
                        </div>
                      </div>
                    )}

                    {/* Controls */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                      <div className="space-y-3 group">
                        <div className="flex justify-between items-center px-1">
                          <label className="text-[11px] font-black text-slate-400 uppercase tracking-widest">1. 選擇音訊 (MP3)</label>
                          {audioFile && <span className="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold animate-zoom-in">已就緒</span>}
                        </div>
                        <input type="file" accept="audio/mp3,audio/mpeg,audio/wav" onChange={handleAudioChange} id="audio-input" className="hidden" ref={audioInputRef}/>
                        <label htmlFor="audio-input" className={`flex flex-col items-center justify-center h-48 border-2 border-dashed rounded-3xl cursor-pointer transition-all duration-300 relative overflow-hidden ${audioFile ? 'border-blue-500 bg-blue-50/50' : 'border-slate-200 hover:border-blue-400 hover:bg-slate-50'}`}>
                          <IconMusic className={`w-12 h-12 mb-3 transition-colors ${audioFile ? 'text-blue-500' : 'text-slate-300 group-hover:text-blue-400'}`} />
                          <div className="z-10 text-center px-4 w-full">
                             {audioFile ? (
                               <>
                                 <p className="text-sm font-bold text-slate-700 truncate w-full">{audioFile.name}</p>
                                 <p className="text-xs text-slate-400 mt-1">{(audioFile.size / 1024 / 1024).toFixed(2)} MB</p>
                               </>
                             ) : <span className="text-xs font-black text-slate-400 group-hover:text-slate-600 transition-colors">點擊上傳 MP3</span>}
                          </div>
                        </label>
                      </div>

                      <div className="space-y-3 group">
                        <div className="flex justify-between items-center px-1">
                           <label className="text-[11px] font-black text-slate-400 uppercase tracking-widest">2. 封面圖片 (選填)</label>
                           {imageFile && <span className="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold animate-zoom-in">已就緒</span>}
                        </div>
                        <input type="file" accept="image/*" onChange={handleImageChange} id="image-input" className="hidden" ref={imageInputRef}/>
                        <label htmlFor="image-input" className={`relative flex flex-col items-center justify-center h-48 border-2 border-dashed border-slate-200 rounded-3xl cursor-pointer overflow-hidden hover:border-indigo-400 transition-all bg-slate-50/50 hover:bg-slate-50 ${previewUrl ? 'border-indigo-500' : ''}`}>
                          {previewUrl ? (
                            <>
                              <img src={previewUrl} className="absolute inset-0 w-full h-full object-cover opacity-60 transition-opacity group-hover:opacity-40 animate-fade-in" alt="Preview" />
                              <div className="absolute inset-0 bg-black/10 group-hover:bg-black/20 transition-colors" />
                            </>
                          ) : null}
                          <div className="relative z-10 flex flex-col items-center shadow-sm">
                            <IconImage className={`w-12 h-12 mb-3 drop-shadow-sm ${previewUrl ? 'text-white' : 'text-slate-300'}`} />
                            <span className={`text-xs font-black px-3 py-1 rounded-full ${previewUrl ? 'bg-black/50 text-white backdrop-blur-sm' : 'text-slate-400'}`}>
                              {imageFile ? '更換圖片' : '預設黑畫面'}
                            </span>
                          </div>
                        </label>
                      </div>
                    </div>

                    {/* Actions */}
                    <div className="pt-8 border-t border-slate-100">
                      {isProcessing ? (
                        <div className="space-y-6 animate-fade-in">
                          <div className="flex justify-between items-end">
                            <div className="flex items-center gap-3 text-blue-600 font-black italic">
                              <IconLoader2 className="w-5 h-5" /> 
                              <span>正在封裝影片... <span className="text-xs font-normal not-italic text-slate-400">(大檔案可能需要幾分鐘)</span></span>
                            </div>
                            <span className="text-slate-400 font-mono text-sm font-bold">{progress}%</span>
                          </div>
                          <div className="h-5 bg-slate-100 rounded-full overflow-hidden p-1 shadow-inner">
                            <div className="h-full bg-gradient-to-r from-blue-500 to-indigo-600 rounded-full transition-all duration-300 ease-out shadow-sm" style={{ width: `${progress}%` }}></div>
                          </div>
                        </div>
                      ) : outputUrl ? (
                        <div className="space-y-8 animate-slide-in-up">
                          <div className="bg-emerald-50 text-emerald-700 py-4 px-6 rounded-2xl flex items-center justify-center gap-3 font-black shadow-sm border border-emerald-100">
                            <IconCheckCircle className="w-6 h-6" /> 轉換成功！
                          </div>
                          
                          <div className="rounded-[2rem] overflow-hidden bg-black aspect-video shadow-2xl border-4 border-white ring-1 ring-slate-200/50">
                            <video src={outputUrl} controls className="w-full h-full" />
                          </div>
                          
                          <div className="flex flex-col gap-4">
                            <a href={outputUrl} download={`${audioFile?.name.replace(/\.[^/.]+$/, "")}_video.mp4`} className="flex items-center justify-center gap-3 bg-slate-900 hover:bg-black text-white py-5 rounded-3xl font-black text-xl shadow-xl shadow-slate-200 transition-all active:scale-[0.98] hover:shadow-2xl">
                              <IconDownload className="w-6 h-6" /> 下載影片檔案
                            </a>
                            <button onClick={handleReset} className="text-slate-400 hover:text-slate-900 text-xs font-black flex items-center justify-center gap-2 py-4 transition-colors uppercase tracking-widest">
                              <IconRefreshCw className="w-4 h-4" /> 轉換另一個檔案
                            </button>
                          </div>
                        </div>
                      ) : (
                        <button
                          disabled={!audioFile || !loaded}
                          onClick={convertToVideo}
                          className={`w-full py-6 rounded-3xl font-black text-2xl shadow-xl transition-all transform active:scale-[0.98] flex items-center justify-center gap-4 ${audioFile && loaded ? 'bg-slate-900 text-white hover:bg-black hover:shadow-2xl shadow-blue-900/20' : 'bg-slate-100 text-slate-300 cursor-not-allowed shadow-none'}`}
                        >
                          <IconVideo className="w-8 h-8" /> 開始生成影片
                        </button>
                      )}
                    </div>
                  </div>

                  <div className="bg-slate-50 p-6 border-t border-slate-200/60 grid grid-cols-2 gap-4">
                    <div className="flex flex-col items-center justify-center">
                      <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">影像規格</p>
                      <p className="text-xs font-bold text-slate-600">H.264 / 720p</p>
                    </div>
                    <div className="flex flex-col items-center justify-center border-l border-slate-200">
                      <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">音訊規格</p>
                      <p className="text-xs font-bold text-slate-600">Copy (無損拷貝)</p>
                    </div>
                  </div>
                </div>
                
                <p className="text-center text-slate-400 text-xs mt-8 font-medium">
                  v0.9.8 • 離線增強版
                </p>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
