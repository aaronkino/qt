<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奇諾影像報價單生成器 整合版 v1.14</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kino: {
                            DEFAULT: '#105482',
                            light: '#1e6fa5',
                            dark: '#0c3e60',
                            50: '#f0f6fa',
                        },
                        'kino-darker': '#31557e', 
                        'kino-medium': '#4470a0', 
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+CJK+TC:wght@400;500;700&display=swap');
        
        body { font-family: 'Inter', 'Noto Sans CJK TC', sans-serif; background-color: #f4f7f9; }
        
        /* 螢幕顯示時隱藏 print-only 元素 */
        .print-only { display: none; }

        /* [v1.09 Change] Robust Footer Background Control */
        .footer-total-area {
            background-color: #f9fafb; /* Screen: Gray 50 */
            border-top: 1px solid #e5e7eb;
        }

        /* Toast Animation */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            pointer-events: none;
            animation: fadeInOut 2s ease-in-out forwards;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* [V53 Change] 列印核心邏輯修正 */
        @media print {
            /* 邊界調整為 10mm */
            @page { size: A4; margin: 10mm; }
            body { background: white; -webkit-print-color-adjust: exact; margin: 0; padding: 0; }
            
            .no-print { display: none !important; }
            .print-only { display: block !important; }

            /* [v1.10 Change] Force Footer Background to #F9FAFB in Print */
            .footer-total-area {
                background-color: #F9FAFB !important; /* 強制設定為您指定的顏色 */
                border-top: 1px solid #808080 !important;
                -webkit-print-color-adjust: exact !important; /* 強制瀏覽器列印背景色 */
                print-color-adjust: exact !important;
            }

            #mobile-root { display: none !important; }
            #desktop-root { 
                display: block !important; 
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }

            .desktop-wrapper { padding: 0 !important; margin: 0 !important; }
            .page-container { 
                box-shadow: none !important; 
                border: none !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                width: 100% !important; 
                max-width: none !important;
            }

            /* 輸入框列印基礎設定 */
            input, textarea, select {
                border: none !important;
                background: transparent !important;
                resize: none;
                padding: 0 !important;
                appearance: none; 
                box-shadow: none !important;
                line-height: 1.3 !important; 
            }
            .input-bg-print-remove {
                background-color: transparent !important;
                border: none !important;
                padding: 0 !important;
            }
            
            /* 表格列印優化 */
            table { border-collapse: separate !important; border-spacing: 0; width: 100% !important; margin-bottom: 0 !important; border: none !important; }
            
            /* 表格高度異常，強制 auto */
            tr, td { height: auto !important; }

            /* [v1.05 Change] Print Table Borders to 50% Gray (#808080) */
            .print-table-container {
                border: 1px solid #808080 !important;
                border-radius: 8px !important;
                overflow: hidden !important;
                margin-bottom: 12px !important;
                background-color: transparent !important;
                box-shadow: none !important;
            }

            /* 線條粗細不均修正 - Gray Borders */
            th, td { 
                border-bottom: 1px solid #808080 !important; 
                border-right: 1px solid #808080 !important; 
                padding: 4px 6px !important; 
                vertical-align: middle; 
            }
            tr:last-child td { border-bottom: none !important; }
            th:last-child, td:last-child { border-right: none !important; }

            th { background-color: #105482 !important; color: white !important; font-weight: bold !important; text-align: center; -webkit-print-color-adjust: exact; }
            
            /* 摘要表格內文改為 9pt */
            .summary-table th, .summary-table td { font-size: 9pt !important; }
            
            /* 細項表格維持原樣或微調 */
            .item-table th, .item-table td { font-size: 9pt !important; }
            
            /* [v1.03 Change] VI. Detailed Services Print Styles */
            /* Force Header to be Light Blue */
            .item-table thead th {
                background-color: #f0f6fa !important; /* kino-50 */
                color: #000 !important; /* Black text for readability on light blue */
                font-weight: bold !important;
                border-bottom: 1px solid #808080 !important; /* Gray border */
            }
            /* Remove any existing gray backgrounds from body rows */
            .item-table tbody tr {
                background-color: transparent !important;
            }

            /* 表頭資訊 (單號、日期、有效期限) 改為 11pt */
            .print-header-info input { font-size: 11pt !important; height: auto !important; }
            .print-header-info label { font-size: 10pt !important; }

            /* 客製化細節字級改為 9pt */
            .print-list-number {
                margin-right: 4px !important;
                font-weight: bold !important;
                min-width: 18px !important;
                margin-top: 6px !important; /* Adjusted alignment */
                font-size: 9pt !important; 
                line-height: 1.4 !important;
                /* 項目符號改為標準藍色 */
                color: #105482 !important; 
            }
            
            /* [v1.05 Change] III. Customization Details Content Style - Reset individual item styles */
            .print-list-text-div {
                padding: 0 !important;
                margin: 0 !important;
                font-size: 9pt !important;
                line-height: 1.5 !important;
                white-space: pre-wrap !important;
                text-align: justify !important;
                background-color: transparent !important; /* Removed specific background */
                border-radius: 0 !important; /* Removed radius */
                display: block !important;
            }
            
            /* 服務細項標題字級縮小 */
            .print-category-header h3 { font-size: 10pt !important; }
            /* 桌面版標題編輯時的列印樣式修正 */
            .print-category-header input { 
                font-size: 10pt !important; 
                color: white !important; 
                font-weight: bold !important;
                width: 100%;
            }

            /* 簽署區內文全藍 */
            .signature-table input { color: #105482 !important; font-weight: bold !important; }
            .signature-table td { color: #105482 !important; } 
            .signature-table .text-black { color: #000 !important; } 

            /* [v1.01 Change] 簽署欄位 - TD 設定 (列印模式改為 200px) */
            .print-signature-row { 
                height: 200px !important; 
                vertical-align: middle !important; 
                padding: 0 !important; 
            }
            
            /* [v1.01 Change] 簽署欄位 - 內部容器強制高度 (列印模式改為 200px) */
            .signature-cell-inner {
                height: 200px !important; 
                width: 100%;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                overflow: hidden !important;
                padding: 0 !important;
            }

            /* [V53 Change] 圖片限縮：保留 5% 留白 (max 90%) */
            .signature-cell-inner img {
                max-height: 90% !important;
                max-width: 90% !important; 
                object-fit: contain !important;
            }

            /* 服務項目總計 (∆) 縮小 */
            .print-summary-text-sm { font-size: 11pt !important; }
            
            /* [v1.02 Change] Removed transparent background forcing here to fix Main Total visibility */
            .print-summary-val-sm { 
                font-size: 11pt !important; 
            }
            
            /* [v1.06 Change] detailed-services-footer: Force white background */
            .detailed-services-footer {
                background-color: white !important; 
                border-top: 1px solid #808080 !important;
                color: #000 !important;
                box-shadow: none !important;
            }

            /* [V53 Change] 強制分頁設定 - 修復邏輯，只負責分頁，不隱藏內容 */
            .page-break-before-always { 
                break-before: page; 
                page-break-before: always; 
                display: block; /* 確保內容可見 */
            }
            
            /* [Ver 1.0 Change] Remove top border for Detailed Services in print */
            .detailed-section {
                border-top: none !important;
                padding-top: 0 !important;
            }
            
            /* 條件分頁 (三與四之間) */
            .section-3-4-break { break-before: page; page-break-before: always; }
            .print-scaled .section-3-4-break { break-before: auto; page-break-before: auto; }

            .section-block { break-inside: avoid; margin-bottom: 10px !important; }
            h1, h2, h3 { break-after: avoid; }
            
            /* 單頁列印縮放調整到 65% */
            .print-scaled { zoom: 0.65 !important; }
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 行動版導覽列遮擋修正 */
        .mobile-section { scroll-margin-top: 80px; }

        /* [V54 Change] 桌面版表格簽署欄高度強制設定為 150px (Screen View Only) */
        .signature-cell-strict-height {
            height: 150px; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signature-cell-strict-height img {
            max-height: 90%;
            max-width: 90%;
            object-fit: contain;
        }
    </style>
</head>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const Toast = ({ message }) => (
            <div className="toast-notification">
                <i className="fas fa-check-circle text-green-400"></i>
                <span>{message}</span>
            </div>
        );

        const AutoResizeTextarea = ({ value, onChange, className, placeholder, style, minRows = 1, mode }) => {
            const textareaRef = useRef(null);
            const adjustHeight = () => { if (textareaRef.current) { textareaRef.current.style.height = 'auto'; textareaRef.current.style.height = textareaRef.current.scrollHeight + 'px'; } };
            useEffect(() => { adjustHeight(); }, [value]);
            useEffect(() => { const timer = setTimeout(adjustHeight, 50); return () => clearTimeout(timer); }, [mode]);
            return ( <textarea ref={textareaRef} rows={minRows} value={value} onChange={(e) => { onChange(e); adjustHeight(); }} className={className} placeholder={placeholder} style={{overflow: 'hidden', ...style}} /> );
        };

        const generateId = () => '_' + Math.random().toString(36).substr(2, 9);

        // [v1.14 Fix] Robust local date string (YYYY-MM-DD) explicitly using local time components

            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;

            const [mode, setMode] = useState('desktop'); 
            const [data, _setData] = useState(getInitialData());
            const [fileHandle, setFileHandle] = useState(null);
            
            // Toast State
            const [toast, setToast] = useState(null);
            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 2000);
            };

            const [history, setHistory] = useState([getInitialData()]);
            const [historyIndex, setHistoryIndex] = useState(0);
            const historyTimeoutRef = useRef(null);

            const setData = (newDataOrFn) => {
                const newData = typeof newDataOrFn === 'function' ? newDataOrFn(data) : newDataOrFn;
                _setData(newData);

                if (historyTimeoutRef.current) clearTimeout(historyTimeoutRef.current);
                
                historyTimeoutRef.current = setTimeout(() => {
                    setHistory(prev => {
                        const newHist = prev.slice(0, historyIndex + 1);
                        if (JSON.stringify(newHist[newHist.length - 1]) !== JSON.stringify(newData)) {
                            newHist.push(newData);
                            setHistoryIndex(newHist.length - 1);
                            return newHist;
                        }
                        return prev;
                    });
                }, 800); 
            };

            const handleUndo = () => {
                // [v1.13 Fix] Clear any pending save operations to prevent overwriting the undo state
                if (historyTimeoutRef.current) clearTimeout(historyTimeoutRef.current);
                
                if (historyIndex > 0) {
                    const newIndex = historyIndex - 1;
                    setHistoryIndex(newIndex);
                    _setData(history[newIndex]);
                }
            };

            const handleRedo = () => {
                // [v1.13 Fix] Clear any pending save operations
                if (historyTimeoutRef.current) clearTimeout(historyTimeoutRef.current);

                if (historyIndex < history.length - 1) {
                    const newIndex = historyIndex + 1;
                    setHistoryIndex(newIndex);
                    _setData(history[newIndex]);
                }
            };

            useEffect(() => {
                const saved = localStorage.getItem('kino_quotation_draft_v2');
                if (saved) { 
                    try { 
                        const parsed = JSON.parse(saved); 
                        // [v1.09 Change] Ensure loaded notes are objects for backward compatibility
                        const notes = ensureNoteObjects(parsed.notes);

                        const loadedData = { 
                            ...getInitialData(), 
                            ...parsed, 
                            header: {...getInitialData().header, ...parsed.header}, 
                            signature: {...getInitialData().signature, ...parsed.signature}, 
                            notes: notes.length > 0 ? notes : getInitialData().notes 
                        };
                        _setData(loadedData);
                        setHistory([loadedData]); 
                        setHistoryIndex(0);
                    } catch (e) { console.error("Load error", e); } 
                }
            }, []);

            useEffect(() => { localStorage.setItem('kino_quotation_draft_v2', JSON.stringify(data)); }, [data]);
            useEffect(() => {
                const datePart = data.header.quotationDate.replace(/-/g, '').substring(2);
                let projName = "專案";
                const pNameItem = data.project.find(p => p.label.includes("專案名稱") || p.label === "名稱");
                if (pNameItem && pNameItem.value) projName = pNameItem.value;
                const suggestedId = `${datePart} ${projName}_KS01`;
                const currentId = data.header.quotationId;
                const isAutoGenerated = !currentId || (currentId.includes("_KS01") && currentId.match(/^\d{6}/));
                if (isAutoGenerated && currentId !== suggestedId) { updateField('header', 'quotationId', suggestedId); }
            }, [data.header.quotationDate, data.project]);

            const updateField = (section, key, value) => { setData(prev => ({ ...prev, [section]: { ...prev[section], [key]: value } })); };
            const calculations = useMemo(() => { let totalA = 0; data.categories.forEach(cat => { (data.items[cat.id] || []).forEach(item => totalA += (item.qty * item.price)); }); let grandTotal = totalA; let taxText = ""; if (data.taxMode === 'included') { grandTotal = Math.round(totalA * 1.05); taxText = "(∆ x 1.05)"; } return { totalA, grandTotal, taxText }; }, [data]);

            const handleOpen = async () => {
                if ('showOpenFilePicker' in window) {
                    try {
                        const [handle] = await window.showOpenFilePicker({
                            types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }],
                        });
                        const file = await handle.getFile();
                        const text = await file.text();
                        const parsed = JSON.parse(text);
                        // [v1.09 Change] Migration for open
                        parsed.notes = ensureNoteObjects(parsed.notes);
                        
                        setData(parsed);
                        setHistory([parsed]);
                        setHistoryIndex(0);
                        setFileHandle(handle); 
                        showToast(`檔案 ${file.name} 開啟成功`);
                    } catch (e) { if(e.name !== 'AbortError') console.error(e); }
                } else {
                    document.getElementById('hidden-file-input').click();
                }
            };

            const handleSave = async () => {
                if (fileHandle && 'showOpenFilePicker' in window) {
                    try {
                        const writable = await fileHandle.createWritable();
                        await writable.write(JSON.stringify(data, null, 2));
                        await writable.close();
                        showToast('儲存成功 (原檔覆蓋)');
                    } catch(e) { console.error(e); showToast('儲存失敗'); }
                } else {
                    handleSaveAs();
                }
            };

            const handleSaveAs = async () => {
                if ('showSaveFilePicker' in window) {
                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: `${data.header.quotationId || 'quotation'}.json`,
                            types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }],
                        });
                        const writable = await handle.createWritable();
                        await writable.write(JSON.stringify(data, null, 2));
                        await writable.close();
                        setFileHandle(handle);
                        showToast('另存成功');
                    } catch (e) { if(e.name !== 'AbortError') console.error(e); }
                } else {
                    const fileName = `${data.header.quotationId || 'quotation'}.json`;
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            };

            const handleLegacyLoad = (e) => { 
                const file = e.target.files[0]; 
                if (!file) return; 
                const reader = new FileReader(); 
                reader.onload = (evt) => { 
                    try { 
                        const parsed = JSON.parse(evt.target.result); 
                        // [v1.09 Change] Migration for legacy load
                        parsed.notes = ensureNoteObjects(parsed.notes);
                        
                        setData(parsed); 
                        setHistory([parsed]); 
                        setHistoryIndex(0); 
                        showToast(`檔案 ${file.name} 載入成功`); 
                    } catch (err) { showToast("檔案格式錯誤"); } 
                }; 
                reader.readAsText(file); 
            };
            const handleManualSave = () => { localStorage.setItem('kino_quotation_draft_v2', JSON.stringify(data)); showToast("已儲存至瀏覽器快取"); };
            const handleReset = () => { if(confirm("確定重置所有內容回到預設值？此動作無法復原。")) { const init = getInitialData(); setData(init); setHistory([init]); setHistoryIndex(0); setFileHandle(null); } };

            return (
                <div className={data.printSettings.scaledMode ? 'print-scaled' : ''}>
                    {toast && <Toast message={toast} />}
                    <input type="file" id="hidden-file-input" className="hidden" accept=".json" onChange={handleLegacyLoad} />
                    <div className="fixed bottom-4 left-4 z-50 no-print flex gap-2 transform scale-75 origin-bottom-left">
                        <button onClick={() => setMode('desktop')} className={`px-4 py-2 rounded-full shadow-lg font-bold transition ${mode === 'desktop' ? 'bg-kino text-white' : 'bg-white text-gray-600'}`}><i className="fas fa-desktop mr-2"></i>Desktop</button>
                        <button onClick={() => setMode('mobile')} className={`px-4 py-2 rounded-full shadow-lg font-bold transition ${mode === 'mobile' ? 'bg-kino text-white' : 'bg-white text-gray-600'}`}><i className="fas fa-mobile-alt mr-2"></i>Mobile</button>
                    </div>
                    
                    <div id="desktop-root" style={{ display: mode === 'desktop' ? 'block' : 'none' }}>
                        <DesktopView 
                            data={data} setData={setData} updateField={updateField} calcs={calculations} compressImage={compressImage} 
                            handleOpen={handleOpen} handleSave={handleSave} handleSaveAs={handleSaveAs} handleReset={handleReset} handleManualSave={handleManualSave} 
                            mode={mode}
                            undo={handleUndo} redo={handleRedo} canUndo={historyIndex > 0} canRedo={historyIndex < history.length - 1}
                        />
                    </div>
                    
                    <div id="mobile-root" style={{ display: mode === 'mobile' ? 'block' : 'none' }}>
                        <MobileView 
                            data={data} setData={setData} updateField={updateField} calcs={calculations} compressImage={compressImage} 
                            handleOpen={handleOpen} handleSave={handleSave} handleReset={handleReset} mode={mode} 
                        />
                    </div>
                </div>
            );
        };

        const DesktopView = ({ data, setData, updateField, calcs, compressImage, handleOpen, handleSave, handleSaveAs, handleReset, handleManualSave, mode, undo, redo, canUndo, canRedo }) => {
            const handleLogoUpload = async (e) => { if (e.target.files[0]) { const base64 = await compressImage(e.target.files[0]); setData(prev => ({ ...prev, logo: base64 })); } };
            
            // [V54 Change] Desktop Scroll functions
            const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });
            const scrollToBottom = () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            return (
                <div className="bg-gray-100 min-h-screen pb-12">
                    {/* [V54 Change] Sticky Top Navigation Bar */}
                    <div className="sticky top-0 z-50 bg-white/95 backdrop-blur supports-[backdrop-filter]:bg-white/60 shadow-sm border-b border-gray-200 px-6 py-3 no-print transition-all">
                        <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-2">
                                <span className="font-bold text-kino mr-2 hidden lg:inline">奇諾影像報價系統 (Desktop)</span>
                                {/* File Operations */}
                                <button onClick={handleOpen} className="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-1.5 px-3 text-sm rounded-lg transition flex items-center"><i className="fas fa-folder-open mr-1.5"></i>開啟</button>
                                <button onClick={handleSave} className="bg-kino hover:bg-kino-dark text-white font-bold py-1.5 px-3 text-sm rounded-lg transition flex items-center shadow-sm"><i className="fas fa-save mr-1.5"></i>儲存</button>
                                <button onClick={handleSaveAs} className="bg-kino-light hover:bg-kino-medium text-white font-bold py-1.5 px-3 text-sm rounded-lg transition flex items-center shadow-sm"><i className="fas fa-download mr-1.5"></i>另存</button>
                                <div className="w-px h-6 bg-gray-300 mx-1"></div>
                                {/* History */}
                                <button onClick={undo} disabled={!canUndo} className={`w-8 h-8 rounded-full flex items-center justify-center transition ${canUndo ? 'bg-gray-100 hover:bg-gray-200 text-gray-700' : 'text-gray-300 cursor-not-allowed'}`} title="復原"><i className="fas fa-undo text-sm"></i></button>
                                <button onClick={redo} disabled={!canRedo} className={`w-8 h-8 rounded-full flex items-center justify-center transition ${canRedo ? 'bg-gray-100 hover:bg-gray-200 text-gray-700' : 'text-gray-300 cursor-not-allowed'}`} title="重做"><i className="fas fa-redo text-sm"></i></button>
                                <button onClick={handleReset} className="ml-1 w-8 h-8 rounded-full flex items-center justify-center text-red-500 hover:bg-red-50 transition" title="重置"><i className="fas fa-trash-alt text-sm"></i></button>
                            </div>

                            <div className="flex items-center gap-4">
                                {/* Settings */}
                                <div className="flex items-center gap-3 text-xs font-bold text-gray-600 bg-gray-50 px-3 py-1.5 rounded-full border border-gray-200">
                                    <label className="flex items-center space-x-1.5 cursor-pointer hover:text-kino"><input type="checkbox" checked={data.printSettings.showDetails} onChange={e => updateField('printSettings', 'showDetails', e.target.checked)} className="accent-kino" /><span>細項</span></label>
                                    <label className="flex items-center space-x-1.5 cursor-pointer hover:text-kino"><input type="checkbox" checked={data.printSettings.showSigDate} onChange={e => updateField('printSettings', 'showSigDate', e.target.checked)} className="accent-kino" /><span>日期</span></label>
                                    <label className="flex items-center space-x-1.5 cursor-pointer hover:text-kino"><input type="checkbox" checked={data.printSettings.scaledMode} onChange={e => updateField('printSettings', 'scaledMode', e.target.checked)} className="accent-kino" /><span>單頁</span></label>
                                </div>
                                <button onClick={() => window.print()} className="bg-gray-800 hover:bg-black text-white font-bold py-1.5 px-4 text-sm rounded-lg transition flex items-center shadow-md"><i className="fas fa-print mr-1.5"></i>列印</button>
                            </div>
                        </div>
                    </div>

                    <div className="px-4 sm:px-8 desktop-wrapper relative">
                        {/* Desktop Scroll Buttons */}
                        <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 no-print">
                            <button onClick={scrollToTop} className="bg-kino text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center opacity-80 hover:opacity-100 transition"><i className="fas fa-arrow-up"></i></button>
                            <button onClick={scrollToBottom} className="bg-kino text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center opacity-80 hover:opacity-100 transition"><i className="fas fa-arrow-down"></i></button>
                        </div>

                        <div className="max-w-5xl mx-auto bg-white rounded-xl shadow-2xl p-6 sm:p-10 page-container border border-gray-200 flex flex-col min-h-[calc(100vh-12rem)] mt-6">
                            
                            <div className="flex-grow">
                                {/* [v1.08 Change] Header: Use Flexbox in print mode to prevent title overlapping/cutting */}
                                <div className="flex items-center justify-between mb-4 border-b-4 border-kino pb-2 relative print:border-b-2">
                                    {/* Logo Column */}
                                    <div className="flex items-center group cursor-pointer relative flex-shrink-0" onClick={() => document.getElementById('d-logo-upload').click()}>
                                        {data.logo ? <img src={data.logo} className="max-h-[56px] max-w-[120px] object-contain" alt="Logo" /> : <div className="h-10 w-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-300 border-2 border-dashed border-gray-300 group-hover:bg-gray-200"><i className="fas fa-image"></i></div>}
                                        <input type="file" id="d-logo-upload" className="hidden" accept="image/*" onChange={handleLogoUpload} />
                                    </div>
                                    
                                    {/* Title Column - Grows to fill space */}
                                    <div className="flex-grow mx-4 text-center">
                                        {/* Screen Mode: Input */}
                                        <input 
                                            className="text-2xl font-extrabold text-gray-900 text-center bg-transparent focus:outline-none w-full no-print" 
                                            value={data.header.title || "奇諾影像報價單(Quotation)"} 
                                            onChange={e => updateField('header', 'title', e.target.value)} 
                                        />
                                        {/* [v1.08 Change] Print Mode: Div with wrap enabled to prevent cutting */}
                                        <div className="print-only text-2xl font-extrabold text-gray-900 text-center whitespace-pre-wrap leading-tight">
                                            {data.header.title || "奇諾影像報價單(Quotation)"}
                                        </div>
                                    </div>

                                    {/* Empty Column for Balance (Screen only) */}
                                    <div className="w-[120px] flex-shrink-0 no-print"></div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 section-block print-header-info">
                                    <div className="flex flex-col"><label className="text-xs font-bold text-gray-700">報價單號：</label><input type="text" value={data.header.quotationId} onChange={e => updateField('header', 'quotationId', e.target.value)} className="font-bold text-kino border-b border-gray-300 focus:outline-none" /></div>
                                    <div className="flex flex-col"><label className="text-xs font-bold text-gray-700">報價日期：</label><input type="date" value={data.header.quotationDate} onChange={e => updateField('header', 'quotationDate', e.target.value)} className="border-b border-gray-300 focus:outline-none" /></div>
                                    <div className="flex flex-col"><label className="text-xs font-bold text-gray-700">有效期限：</label><input type="text" value={data.header.validity} onChange={e => updateField('header', 'validity', e.target.value)} className="text-red-600 border-b border-gray-300 focus:outline-none" /></div>
                                </div>
                                <div className="section-block">
                                    <div className="flex justify-between items-center mt-6 mb-2 border-l-4 border-kino pl-3"><h2 className="text-lg font-bold">一、 專案內容概況 (Project Overview)</h2><button className="no-print bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs rounded-full p-1 px-2" onClick={() => { const newProj = [...data.project, {label: "項目", value: ""}]; setData({...data, project: newProj}); }}><i className="fas fa-plus"></i></button></div>
                                    <div className="mb-4 grid grid-cols-2 gap-x-6 gap-y-2 text-sm">{data.project.map((p, idx) => (<div key={idx} className="flex items-center gap-2 group relative"><input className="font-semibold text-gray-700 bg-transparent border-b w-1/3 text-right" value={p.label} onChange={e => { const newP = [...data.project]; newP[idx] = {...newP[idx], label: e.target.value}; setData({...data, project: newP}); }} /><span className="text-gray-500">：</span><input className="w-2/3 border-b border-gray-300" value={p.value} onChange={e => { const newP = [...data.project]; newP[idx] = {...newP[idx], value: e.target.value}; setData({...data, project: newP}); }} /><button className="no-print absolute right-0 text-red-300 hover:text-red-500 opacity-0 group-hover:opacity-100" onClick={() => { const newP = data.project.filter((_, i) => i !== idx); setData({...data, project: newP}); }}><i className="fas fa-times"></i></button></div>))}</div>
                                </div>
                                <div className="section-block">
                                    <div className="flex justify-between items-center mt-6 mb-2 border-l-4 border-kino pl-3"><h2 className="text-lg font-bold">二、 專案報價 (Quotation Summary)</h2><button className="no-print bg-gray-200 text-xs px-2 py-1 rounded-full" onClick={() => { const id = generateId(); setData({ ...data, categories: [...data.categories, {id, name: "新摘要"}], items: {...data.items, [id]: []} }); }}><i className="fas fa-plus mr-1"></i>新增摘要</button></div>
                                    <div className="print-table-container border border-gray-300 rounded-lg overflow-hidden mb-4 shadow-sm">
                                        <table className="w-full text-left text-sm summary-table m-0">
                                            <thead className="bg-kino text-white">
                                                <tr><th className="p-2 border-r border-kino-medium w-2/3 text-left">摘要 (Summary)</th><th className="p-2 w-1/3 text-right">總計 (NTD)</th><th className="w-8 no-print border-none"></th></tr>
                                            </thead>
                                            <tbody>
                                                {data.categories.map((cat, idx) => { 
                                                    const subtotal = (data.items[cat.id] || []).reduce((acc, item) => acc + (item.qty * item.price), 0); 
                                                    return (
                                                    <tr key={cat.id} className="hover:bg-gray-50 bg-white border-b border-gray-200 last:border-0">
                                                        <td className="p-2 border-r border-gray-200"><input value={cat.name} onChange={e => { const newC = data.categories.map(c => c.id === cat.id ? {...c, name: e.target.value} : c); setData({...data, categories: newC}); }} className="w-full bg-transparent font-bold text-gray-700" /></td>
                                                        <td className="p-2 text-right">{formatCurrency(subtotal)}</td>
                                                        <td className="no-print text-center p-2"><button onClick={() => { if(confirm("確定刪除?")) { const newC = data.categories.filter(c => c.id !== cat.id); const newI = {...data.items}; delete newI[cat.id]; setData({...data, categories: newC, items: newI}); } }} className="text-red-400 hover:text-red-600"><i className="fas fa-minus-circle"></i></button></td>
                                                    </tr>)
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div className="max-w-md ml-auto border border-kino rounded-lg overflow-hidden text-sm summary-block break-inside-avoid"><div className="bg-gray-50 px-2 py-1 text-right border-b border-gray-200 no-print"><label className="text-xs font-bold text-gray-500 mr-1">稅額計算：</label><select value={data.taxMode} onChange={e => setData({...data, taxMode: e.target.value})} className="text-xs border rounded bg-white"><option value="excluded">報價未稅</option><option value="inclusive_flat">報價含稅</option><option value="included">稅外 (5%)</option></select></div><div className="grid grid-cols-2 font-medium"><div className="bg-gray-100 px-2 py-1 flex items-center print-summary-text-sm"><span>服務項目總計 (∆)</span></div><div className="bg-gray-100 px-2 py-1 text-right font-bold text-gray-800 print-summary-val-sm">{formatCurrency(calcs.totalA)}</div><div className="bg-kino text-white px-2 py-1 flex flex-col justify-center"><span className="font-bold print-summary-text-sm">本次報價總金額 ({data.taxMode === 'included' || data.taxMode === 'inclusive_flat' ? '含稅' : '未稅'})</span>{calcs.taxText && <span className="text-xs opacity-90 scale-90 origin-left">{calcs.taxText}</span>}</div><div className="bg-kino text-white px-2 py-1 text-right font-extrabold text-lg flex items-center justify-end print-summary-val-sm">{formatCurrency(calcs.grandTotal)}</div></div></div>
                                <div className="section-block">
                                    <div className="flex justify-between items-center mt-6 mb-2 border-l-4 border-kino pl-3"><h2 className="text-lg font-bold">三、 客製化專案細節 (Customization Details)</h2><div className="text-xs text-gray-400 no-print"><i className="fas fa-pen mr-1"></i>點擊下方文字即可編輯。</div></div>
                                    
                                    {/* [v1.05 Change] Added container styling for print background */}
                                    <div className="space-y-2 mt-4 print:bg-kino-50 print:p-4 print:rounded-lg">
                                        {/* [v1.09 Change] Map using unique ID key */}
                                        {data.notes.map((note, i) => (
                                            <div key={note.id} className="flex items-start group print-list-item">
                                                <span className="print-list-number font-bold text-gray-700 mr-2 mt-2 w-6 text-right select-none">{i + 1}.</span>
                                                <div className="flex-1 relative">
                                                    <AutoResizeTextarea
                                                        value={note.text}
                                                        mode={mode}
                                                        onChange={e => { const newNotes = [...data.notes]; newNotes[i] = {...newNotes[i], text: e.target.value}; setData({...data, notes: newNotes}); }}
                                                        className="w-full bg-gray-50 border border-gray-200 rounded p-2 text-sm focus:bg-white focus:border-kino focus:ring-1 focus:ring-kino transition-colors resize-none overflow-hidden no-print"
                                                    />
                                                    <div className="print-only print-list-text-div text-sm text-gray-700 leading-tight whitespace-pre-wrap">{note.text}</div>
                                                    <button className="no-print absolute -right-8 top-1 text-red-200 hover:text-red-500 opacity-0 group-hover:opacity-100 transition" onClick={() => { const newNotes = data.notes.filter((_, idx) => idx !== i); setData({...data, notes: newNotes}); }}><i className="fas fa-trash-alt"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    
                                    <button className="no-print mt-3 text-xs text-gray-500 hover:text-kino flex items-center" onClick={() => setData({...data, notes: [...data.notes, { id: generateId(), text: "新條款..." }]})}><i className="fas fa-plus mr-1"></i>新增條款</button>
                                </div>
                                <div className="section-3-4-break"></div>
                                <div className="section-block">
                                    <div className="flex justify-between items-center mt-6 mb-2 border-l-4 border-kino pl-3"><h2 className="text-lg font-bold">四、 付款方式與條款 (Payment Methods)</h2><button className="no-print bg-gray-200 text-xs px-2 rounded-full" onClick={() => { setData({...data, payment: {terms: [...data.payment.terms, {phase: "", percent: "", condition: "", notes: ""}]}}); }}><i className="fas fa-plus"></i></button></div>

                                <div className="section-block signature-block">
                                    <h2 className="text-lg font-bold mt-6 mb-2 border-l-4 border-kino pl-3">五、 報價確認與簽署 (Signatures)</h2>

                                                {/* Strict Height Signature Row */}

                                                        <input type="file" id="client-sig-upload" className="hidden" onChange={async e => { if(e.target.files[0]) { const base64 = await compressImage(e.target.files[0]); updateField('signature', 'clientSigImg', base64); } }} />
                                                    </td>
                                                    <td className="relative cursor-pointer hover:bg-gray-50 print-signature-row" onClick={() => document.getElementById('vendor-sig-upload').click()}>
                                                        <div className="absolute bottom-2 left-0 right-0 border-b border-black mx-4 no-print"></div>
                                                        <div className="signature-cell-inner signature-cell-strict-height">
                                                            {data.signature.vendorSigImg && <img src={data.signature.vendorSigImg} />}
                                                        </div>
                                                        <span className="absolute top-2 right-2 text-xs text-gray-300 no-print">上傳</span>
                                                        <input type="file" id="vendor-sig-upload" className="hidden" onChange={async e => { if(e.target.files[0]) { const base64 = await compressImage(e.target.files[0]); updateField('signature', 'vendorSigImg', base64); } }} />
                                                    </td>
                                                </tr>

                                                {data.printSettings.showSigDate && (<tr className="bg-white"><td className="font-bold bg-kino-50 p-2 border-r border-gray-200 text-black">日期</td><td colSpan="2" className="p-2 text-center"><input type="date" value={data.signature.signatureDate} onChange={e => updateField('signature', 'signatureDate', e.target.value)} className="input-bg-print-remove text-kino font-bold" /></td></tr>)}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div className={`detailed-section mt-6 border-t pt-4 page-break-before-always ${!data.printSettings.showDetails ? 'no-print' : ''}`}>
                                    <h2 className="text-xl font-bold mb-4 border-l-8 border-kino pl-4">六、 服務細項與描述 (Detailed Services)</h2>
                                    {data.categories.map((cat, idx) => { 
                                        const isDark = idx % 2 === 0; 
                                        const headerClass = isDark ? 'bg-kino-darker text-white' : 'bg-kino-medium text-white'; 
                                        const subtotal = (data.items[cat.id] || []).reduce((acc, item) => acc + (item.qty * item.price), 0); 
                                        return (
                                            <div key={cat.id} className="mb-6 border border-gray-300 rounded-lg overflow-hidden shadow-md break-inside-avoid print-table-container">
                                                <div className={`flex justify-between items-center ${headerClass} p-3 print-category-header`}>
                                                    <input className="font-bold bg-transparent text-white focus:outline-none w-full" value={cat.name} onChange={e => { const newC = data.categories.map(c => c.id === cat.id ? {...c, name: e.target.value} : c); setData({...data, categories: newC}); }} />
                                                    <button className={`no-print text-xs font-bold py-1 px-3 rounded-full ml-2 whitespace-nowrap ${isDark ? 'bg-white text-kino-darker' : 'bg-white text-kino-medium'}`} onClick={() => { const newItems = [...(data.items[cat.id] || []), {desc: "新項目", qty: 1, unit: "式", price: 0}]; setData({...data, items: {...data.items, [cat.id]: newItems}}); }}><i className="fas fa-plus mr-1"></i>新增項目</button>

                                                <table className="w-full text-sm item-table">
                                                    <thead className="bg-gray-100"><tr><th className="p-2 text-left w-5/12 border-r border-gray-200">細項</th><th className="p-2 text-center w-1/12 border-r border-gray-200">數量</th><th className="p-2 text-center w-1/12 border-r border-gray-200">單位</th><th className="p-2 text-right w-2/12 border-r border-gray-200">單價</th><th className="p-2 text-right w-2/12">小計</th><th className="p-2 w-1/12 no-print"></th></tr></thead>
                                                    <tbody>{(data.items[cat.id] || []).map((item, i) => (<tr key={i} className="border-b border-gray-100"><td className="p-2 border-r border-gray-200"><input className="w-full input-bg-print-remove" value={item.desc} onChange={e => { const newItems = [...data.items[cat.id]]; newItems[i] = {...newItems[i], desc: e.target.value}; setData({...data, items: {...data.items, [cat.id]: newItems}}); }} /></td><td className="p-2 border-r border-gray-200"><input type="number" className="w-full text-center input-bg-print-remove" value={item.qty} onChange={e => { const newItems = [...data.items[cat.id]]; newItems[i] = {...newItems[i], qty: parseInt(e.target.value)||0}; setData({...data, items: {...data.items, [cat.id]: newItems}}); }} /></td><td className="p-2 border-r border-gray-200"><input className="w-full text-center input-bg-print-remove" value={item.unit} onChange={e => { const newItems = [...data.items[cat.id]]; newItems[i] = {...newItems[i], unit: e.target.value}; setData({...data, items: {...data.items, [cat.id]: newItems}}); }} /></td>
                                                    <td className="p-2 border-r border-gray-200 text-right">
                                                        <span className="print-only">{formatCurrency(item.price)}</span>
                                                        <input 
                                                            type="number" 
                                                            className="w-full text-right input-bg-print-remove no-print" 
                                                            value={item.price} 
                                                            onChange={e => { 
                                                                const val = parseFloat(e.target.value); 
                                                                const newItems = [...data.items[cat.id]]; 
                                                                newItems[i] = {...newItems[i], price: isNaN(val) ? 0 : val};

                                                </table>

                                                <div className="text-right p-3 footer-total-area font-bold print-summary-val-sm detailed-services-footer">總計：{formatCurrency(subtotal)} NTD</div>

                                    })}

                            {/* Footer for version info */}
                            <div className="text-center text-xs text-gray-400 py-4 no-print mt-auto">
                                奇諾影像報價單生成器 整合版 v1.14
                            </div>
