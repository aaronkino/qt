    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+CJK+TC:wght@400;500;700&display=swap');
        
        body { font-family: 'Inter', 'Noto Sans CJK TC', sans-serif; background-color: #f4f7f9; }
        
        /* 螢幕顯示時隱藏 print-only 元素 */
        .print-only { display: none; }

        /* [v1.09 Change] Robust Footer Background Control */
        .footer-total-area {
            background-color: #f9fafb; /* Screen: Gray 50 */
            border-top: 1px solid #e5e7eb;
        }

        /* Toast Animation */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            pointer-events: none;
            animation: fadeInOut 2s ease-in-out forwards;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* [V53 Change] 列印核心邏輯修正 */
        @media print {
            .print-header-info .validity-input {
                color: #b91c1c !important;
                -webkit-text-fill-color: #b91c1c !important;
            }
            .print-header-info .validity-label {
                color: #374151 !important;
                font-size: 10pt !important;
            }
            /* A4 安全邊界：保留印表機裁切空間，同時提高單頁可用高度。 */
            @page { size: A4; margin: 8mm; }
            body { background: white; -webkit-print-color-adjust: exact; margin: 0; padding: 0; }
            
            .no-print { display: none !important; }
            .print-only { display: block !important; }

            /* [v1.10 Change] Force Footer Background to #F9FAFB in Print */
            .footer-total-area {
                background-color: #F9FAFB !important; /* 強制設定為您指定的顏色 */
                border-top: 1px solid #808080 !important;
                -webkit-print-color-adjust: exact !important; /* 強制瀏覽器列印背景色 */
                print-color-adjust: exact !important;
            }

            #mobile-root { display: none !important; }
            #desktop-root { 
                display: block !important; 
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                /* [Fix] 移除背景色，避免出現灰色區塊 */
                background-color: white !important;
            }
            
            /* [Fix] 強制移除背景色類別的影響 */
            .bg-gray-100 {
                background-color: white !important;
            }

            .desktop-wrapper { padding: 0 !important; margin: 0 !important; }
            .page-container { 
                box-shadow: none !important; 
                border: none !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                width: 100% !important; 
                max-width: none !important;
                /* [Fix] 列印時移除圓角，避免與背景色產生視覺落差 */
                border-radius: 0 !important;
            }

            /* 輸入框列印基礎設定 */
            input, textarea, select {
                border: none !important;
                background: transparent !important;
                resize: none;
                padding: 0 !important;
                appearance: none; 
                box-shadow: none !important;
                line-height: 1.3 !important; 
            }
            .input-bg-print-remove {
                background-color: transparent !important;
                border: none !important;
                padding: 0 !important;
            }
            
            /* 表格列印優化 */
            table { border-collapse: separate !important; border-spacing: 0; width: 100% !important; margin-bottom: 0 !important; border: none !important; }
            
            /* 表格高度異常，強制 auto */
            tr, td { height: auto !important; }

            /* [v1.05 Change] Print Table Borders to 50% Gray (#808080) */
            .print-table-container {
                border: 1px solid #808080 !important;
                border-radius: 8px !important;
                overflow: hidden !important;
                margin-bottom: 12px !important;
                background-color: transparent !important;
                box-shadow: none !important;
            }

            /* 線條粗細不均修正 - Gray Borders */
            th, td { 
                border-bottom: 1px solid #808080 !important; 
                border-right: 1px solid #808080 !important; 
                padding: 4px 6px !important; 
                vertical-align: middle; 
            }
            tr:last-child td { border-bottom: none !important; }
            th:last-child, td:last-child { border-right: none !important; }

            th { background-color: #105482 !important; color: white !important; font-weight: bold !important; text-align: center; -webkit-print-color-adjust: exact; }
            
            /* 摘要表格內文改為 9pt */
            .summary-table th, .summary-table td { font-size: 9pt !important; }
            
            /* 細項表格維持原樣或微調 */
            .item-table th, .item-table td { font-size: 9pt !important; }
            
            /* [v1.03 Change] VI. Detailed Services Print Styles */
            /* Force Header to be Light Blue */
            .item-table thead th {
                background-color: #f0f6fa !important; /* kino-50 */
                color: #000 !important; /* Black text for readability on light blue */
                font-weight: bold !important;
                border-bottom: 1px solid #808080 !important; /* Gray border */
            }
            /* Remove any existing gray backgrounds from body rows */
            .item-table tbody tr {
                background-color: transparent !important;
            }

            /* 表頭資訊 (單號、日期、有效期限) 改為 11pt */
            .print-header-info input { font-size: 11pt !important; height: auto !important; }
            .print-header-info label { font-size: 10pt !important; }

            /* 客製化細節字級改為 9pt */
            .print-list-number {
                margin-right: 4px !important;
                font-weight: bold !important;
                min-width: 18px !important;
                margin-top: 0 !important; /* [Fix] Remove top margin to align with text */
                font-size: 9pt !important; 
                line-height: 1.5 !important; /* [Fix] Match text line-height */
                /* 項目符號改為標準藍色 */
                color: #105482 !important; 
            }
            
            /* [v1.05 Change] III. Customization Details Content Style - Reset individual item styles */
            .print-list-text-div {
                padding: 0 !important;
                margin: 0 !important;
                font-size: 9pt !important;
                line-height: 1.5 !important;
                white-space: pre-wrap !important;
                text-align: justify !important;
                background-color: transparent !important; /* Removed specific background */
                border-radius: 0 !important; /* Removed radius */
                display: block !important;
            }
            
            /* 服務細項標題字級縮小 */
            .print-category-header h3 { font-size: 10pt !important; }
            /* 桌面版標題編輯時的列印樣式修正 */
            .print-category-header input { 
                font-size: 10pt !important; 
                color: white !important; 
                font-weight: bold !important;
                width: 100%;
            }

            /* 簽署區內文全藍 */
            .signature-table input { color: #105482 !important; font-weight: bold !important; }
            .signature-table td { color: #105482 !important; } 
            .signature-table .text-black { color: #000 !important; } 

            /* [v1.01 Change] 簽署欄位 - TD 設定 (列印模式改為 200px) */
            .print-signature-row { 
                height: 200px !important; 
                vertical-align: middle !important; 
                padding: 0 !important; 
            }
            
            /* [v1.01 Change] 簽署欄位 - 內部容器強制高度 (列印模式改為 200px) */
            .signature-cell-inner {
                height: 200px !important; 
                width: 100%;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                overflow: hidden !important;
                padding: 0 !important;
            }

            /* [V53 Change] 圖片限縮：保留 5% 留白 (max 90%) */
            .signature-cell-inner img {
                max-height: 90% !important;
                max-width: 90% !important; 
                object-fit: contain !important;
            }

            /* 服務項目總計 (∆) 縮小 */
            .print-summary-text-sm { font-size: 11pt !important; }
            
            /* [v1.02 Change] Removed transparent background forcing here to fix Main Total visibility */
            .print-summary-val-sm { 
                font-size: 11pt !important; 
            }
            
            /* [v1.06 Change] detailed-services-footer: Force white background */
            .detailed-services-footer {
                background-color: white !important; 
                border-top: 1px solid #808080 !important;
                color: #000 !important;
                box-shadow: none !important;
            }

            /* [V53 Change] 強制分頁設定 - 修復邏輯，只負責分頁，不隱藏內容 */
            .page-break-before-always { 
                break-before: page; 
                page-break-before: always; 
                display: block; /* 確保內容可見 */
            }
            
            /* [Ver 1.0 Change] Remove top border for Detailed Services in print */
            .detailed-section {
                border-top: none !important;
                padding-top: 0 !important;
            }
            
            /* 條件分頁 (三與四之間) */
            .section-3-4-break { break-before: page; page-break-before: always; }
            .print-scaled .section-3-4-break { break-before: auto; page-break-before: auto; }

            .section-block { break-inside: avoid; margin-bottom: 10px !important; }
            h1, h2, h3 { break-after: avoid; }
            
            /* 快速報價：專用 A4 結構，以雙欄分配內容，不縮放整張文件。 */
            .quotation-quick { zoom: 1 !important; }
            .quotation-quick .standard-document-content { display: none !important; }
            .quotation-quick .quick-print-sheet { display: block !important; }
            .quotation-quick .page-container { min-height: 0 !important; }
            .quotation-quick #desktop-root > .bg-gray-100 {
                min-height: 0 !important;
                padding-bottom: 0 !important;
            }

            .quick-print-sheet {
                color: #182230;
                font-size: 9pt;
                line-height: 1.3;
            }
            .quick-print-header {
                display: grid;
                grid-template-columns: 34mm 1fr;
                align-items: center;
                min-height: 12mm;
                padding-bottom: 1.5mm;
                border-bottom: 1px solid #d0d5dd;
            }
            .quick-print-logo { max-width: 30mm; max-height: 13mm; object-fit: contain; }
            .quick-print-title { text-align: right; }
            .quick-print-title h1 { margin: 1mm 0 0; font-size: 18pt; line-height: 1.05; font-weight: 800; letter-spacing: .02em; }
            .quick-print-badge {
                display: block;
                margin: 0;
                padding: 0;
                background: transparent;
                color: #105482;
                font-size: 7.5pt;
                font-weight: 700;
                letter-spacing: .16em;
            }
            .quick-print-meta {
                display: grid;
                /* 有效期限的左邊界對齊專案概況第二欄；日期縮窄，空間留給單號。 */
                grid-template-columns: 66.25mm 27mm minmax(0, 1fr);
                gap: 2.5mm;
                padding: 1.2mm 0;
            }
            .quick-print-meta > div { min-width: 0; padding: .8mm 2mm; border-radius: 2mm; background: #f2f6f9; font-size: 7.5pt; line-height: 1.2; }
            .quick-print-meta strong { display: block; margin: 0 0 .35mm; color: #667085; font-size: 7pt; line-height: 1.1; letter-spacing: .06em; }
            .quick-print-validity { overflow-wrap: anywhere; color: #b91c1c; }
            .quick-print-flow { display: block; }
            .quick-print-section { break-inside: avoid; page-break-inside: avoid; }
            .quick-print-section + .quick-print-section { margin-top: 1.8mm; }
            .quick-print-section h2 {
                margin: 0 0 .8mm;
                padding: .8mm 2mm;
                border: 0;
                border-radius: 1.8mm;
                background: #eaf2f7;
                color: #105482;
                font-size: 8pt;
                line-height: 1.15;
                font-weight: 700;
                letter-spacing: .12em;
            }
            .quick-project-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2mm 2.5mm; }
            .quick-project-item { display: grid; grid-template-columns: 22mm 1fr; min-width: 0; padding: .6mm 2mm; border: 0; border-radius: 1.5mm; background: #f7f9fb; }
            .quick-project-item strong { color: #667085; font-size: 8pt; font-weight: 600; }
            .quick-summary-list { display: grid; gap: .7mm; font-size: 8.8pt; }
            /* 數量欄起點與右側專案欄的「值」起點對齊：半欄 + 類別標籤寬度。 */
            .quick-summary-row { display: grid; grid-template-columns: calc((100% - 2.5mm) / 2 + 21.5mm) 20mm minmax(0, 1fr); gap: 3mm; padding: .4mm 2mm; border: 0; border-radius: 1.3mm; background: #f7f9fb; }

            useEffect(() => { const timer = setTimeout(adjustHeight, 50); return () => clearTimeout(timer); }, [mode]);
            return ( <textarea ref={textareaRef} rows={minRows} value={value} onChange={(e) => { onChange(e); adjustHeight(); }} className={className} placeholder={placeholder} style={{overflow: 'hidden', ...style}} /> );
        };

            </select>
        );

        const SignatureCapture = ({ label, image, uploadId, onChange, compact = false }) => {
            const [isSigning, setIsSigning] = useState(false);
            const canvasRef = useRef(null);
            const drawingRef = useRef(false);
            const pointRef = useRef(null);
            const getPoint = (event) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                return { x: (event.clientX - rect.left) * (canvas.width / rect.width), y: (event.clientY - rect.top) * (canvas.height / rect.height) };
            };
            const drawTo = (point) => {
                const canvas = canvasRef.current;
                const context = canvas?.getContext('2d');
                if (!context || !pointRef.current) return;
                context.lineCap = 'round';
                context.lineJoin = 'round';
                context.strokeStyle = '#113850';
                context.lineWidth = 5;
                context.beginPath();
                context.moveTo(pointRef.current.x, pointRef.current.y);
                context.lineTo(point.x, point.y);
                context.stroke();
                pointRef.current = point;
            };
            const clearCanvas = () => {
                const canvas = canvasRef.current;
                canvas?.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            };
            const saveSignature = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                onChange(canvas.toDataURL('image/png'));
                setIsSigning(false);
            };
            return (
                <>
                    <div className={`signature-cell-inner signature-cell-strict-height relative ${compact ? 'signature-capture-compact border border-dashed border-gray-300 rounded-lg bg-gray-50' : ''}`}>

                            {image && <button type="button" onClick={() => onChange('')} className="rounded bg-white/95 border border-red-200 px-1.5 py-0.5 text-[10px] text-red-500 shadow-sm">清除</button>}
                        </div>
                    </div>

                        <div className="w-full max-w-lg rounded-2xl bg-white p-4 shadow-2xl">
                            <div className="mb-3 flex items-center justify-between"><h3 className="font-bold text-kino">{label}手寫簽名</h3><button type="button" onClick={() => setIsSigning(false)} className="text-gray-400 hover:text-gray-700"><i className="fas fa-times"></i></button></div>
                            <canvas ref={canvasRef} width="900" height="380" className="w-full rounded-xl border-2 border-dashed border-kino/30 bg-[#fbfdff] touch-none" onPointerDown={event => { event.currentTarget.setPointerCapture(event.pointerId); drawingRef.current = true; pointRef.current = getPoint(event); }} onPointerMove={event => { if (drawingRef.current) drawTo(getPoint(event)); }} onPointerUp={() => { drawingRef.current = false; pointRef.current = null; }} onPointerCancel={() => { drawingRef.current = false; pointRef.current = null; }} />
                            <p className="mt-2 text-xs text-gray-400">請以滑鼠、觸控筆或手指簽名；儲存後會直接出現在 PDF 的簽章欄。</p>
                            <div className="mt-4 flex justify-end gap-2"><button type="button" onClick={clearCanvas} className="rounded-lg border px-3 py-2 text-sm text-gray-600">清除筆跡</button><button type="button" onClick={saveSignature} className="rounded-lg bg-kino px-3 py-2 text-sm font-bold text-white">使用此簽名</button></div>

                    </div>}

        const PAYMENT_TEMPLATES = {
            "3stage": [ { phase: "第一期 (訂金)", percent: "40%", condition: "本報價單/合約簽訂後 3 日內支付。", notes: "專案正式啟動" }, { phase: "第二期 (拍攝款)", percent: "30%", condition: "影片拍攝日結束後 3 日內支付。", notes: "拍攝團隊費用" }, { phase: "第三期 (尾款)", percent: "30%", condition: "最終成品 (Final) 交付後 7 日內支付。", notes: "專案結案及剪輯費用" } ],
            "2stage": [ { phase: "第一期 (訂金)", percent: "50%", condition: "本報價單/合約簽訂後 3 日內支付。", notes: "專案正式啟動" }, { phase: "第二期 (尾款)", percent: "50%", condition: "最終成品 (Final) 交付後 7 日內支付。", notes: "專案結案及剪輯費用" } ],
            "full_pre": [ { phase: "全額付清 (先付)", percent: "100%", condition: "本報價單/合約簽訂後 3 日內支付。", notes: "一次性付款 (預付)" } ],
            "full_post": [ { phase: "全額付清 (後付)", percent: "100%", condition: "最終成品 (Final) 交付後 7 日內支付。", notes: "一次性付款 (驗收後)" } ]
        };

        const BUILTIN_CONTRACT_TEMPLATES = [

        const loadContractTemplates = () => {
            try {
                const stored = JSON.parse(localStorage.getItem(CONTRACT_TEMPLATE_STORAGE_KEY) || '[]');

        };
        const normalizeClauseRecord = (clause) => {
            if (!clause?.id || typeof clause?.category !== 'string' || typeof clause?.text !== 'string') return null;
            return {
                id: String(clause.id),
                categoryId: typeof clause.categoryId === 'string' && clause.categoryId ? clause.categoryId : makeClauseCategoryId(clause.category),
                category: clause.category.trim() || '未分類',
                text: clause.text.trim(),
                severity: [1, 2, 3].includes(Number(clause.severity)) ? Number(clause.severity) : 2,
                sortOrder: Number.isFinite(Number(clause.sortOrder)) ? Math.trunc(Number(clause.sortOrder)) : 0,
                isCore: Boolean(clause.isCore),
                coreOrder: clause.coreOrder == null ? null : Number(clause.coreOrder),
                updatedAt: clause.updatedAt || new Date().toISOString()
            };
        };
        const normalizeClauseCategoryRecord = (category, index = 0) => {
            if (!category?.id || typeof category?.name !== 'string' || !category.name.trim()) return null;
            return {
                id: String(category.id),
                name: category.name.trim(),
                sortOrder: Number.isFinite(Number(category.sortOrder)) ? Math.trunc(Number(category.sortOrder)) : index + 1,
                updatedAt: category.updatedAt || new Date().toISOString()
            };
        };
        const buildInitialClauseLibrary = () => {
            const legacyClauses = loadContractTemplates().flatMap((template, templateIndex) =>
                template.notes.map((text, noteIndex) => makeClauseRecord(
                    `legacy-${template.id}-${noteIndex + 1}`,
                    `舊範本｜${template.name}`,
                    String(text || '').trim(),
                    2,
                    templateIndex * 100 + noteIndex + 1
                )).filter(clause => clause.text)
            );
            return sortClauseLibrary([...DEFAULT_CLAUSE_LIBRARY.map(clause => ({ ...clause })), ...legacyClauses]);
        };
        const loadClauseLibrary = () => {
            try {
                const raw = localStorage.getItem(CLAUSE_LIBRARY_STORAGE_KEY);
                if (!raw) return buildInitialClauseLibrary();
                const stored = JSON.parse(raw);
                if (!Array.isArray(stored)) return buildInitialClauseLibrary();
                return sortClauseLibrary(stored.map(normalizeClauseRecord).filter(clause => clause?.text));
            } catch (error) {
                console.warn('Clause library load error', error);
                return buildInitialClauseLibrary();
            }
        };
        const buildInitialClauseCategories = (clauses = buildInitialClauseLibrary()) => {
            const categoryMap = new Map(DEFAULT_CLAUSE_CATEGORIES.map(category => [category.id, { ...category }]));
            clauses.forEach(clause => {
                const id = clause.categoryId || makeClauseCategoryId(clause.category);
                if (!categoryMap.has(id)) {
                    categoryMap.set(id, {
                        id,
                        name: clause.category,
                        sortOrder: categoryMap.size + 1,
                        updatedAt: clause.updatedAt || CLAUSE_SEED_UPDATED_AT
                    });
                }
            });
            return sortClauseCategories([...categoryMap.values()]);
        };
        const loadClauseCategories = () => {

                if (!Array.isArray(stored)) return buildInitialClauseCategories();

        const formatCurrency = (val) => new Intl.NumberFormat('zh-TW').format(val);

        const compressImage = (file) => { 
            return new Promise((resolve) => { 
                const reader = new FileReader(); 
                reader.readAsDataURL(file); 
                reader.onload = (event) => { 
                    const img = new Image(); 
                    img.src = event.target.result; 
                    img.onload = () => { 
                        const canvas = document.createElement('canvas'); 
                        const MAX_WIDTH = 800; 
                        let width = img.width; 
                        let height = img.height; 
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } 
                        canvas.width = width; 
                        canvas.height = height; 
                        const ctx = canvas.getContext('2d'); 
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height); 
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                    }; 
                }; 
            }); 
        };

        const App = () => {

            const [deletedClauseIds, setDeletedClauseIds] = useState(() => loadDeletedIds(DELETED_CLAUSE_STORAGE_KEY));

            const [cloudSyncStatus, setCloudSyncStatus] = useState('idle');
            const [cloudAuthStatus, setCloudAuthStatus] = useState('idle');
            const [googleClientId, setGoogleClientId] = useState('');
            const [microsoftClientId, setMicrosoftClientId] = useState('');
            const [cloudAuthUser, setCloudAuthUser] = useState(() => {

            const [oneDriveAutoSave, setOneDriveAutoSave] = useState(() => localStorage.getItem(ONEDRIVE_AUTOSAVE_STORAGE_KEY) === 'true');

            const [oneDriveLastSavedAt, setOneDriveLastSavedAt] = useState('');
            const [oneDriveFolders, setOneDriveFolders] = useState([]);
            const [oneDriveFolderStack, setOneDriveFolderStack] = useState([{ id: 'root', name: 'OneDrive', path: '/' }]);
            const [oneDriveFolderLoading, setOneDriveFolderLoading] = useState(false);
            const [oneDriveFolderError, setOneDriveFolderError] = useState('');

            const hadLocalClauseLibraryRef = useRef(localStorage.getItem(CLAUSE_LIBRARY_STORAGE_KEY) !== null);

            const [history, setHistory] = useState([getInitialData()]);

                historyTimeoutRef.current = setTimeout(() => {
                    setHistory(prev => {
                        const newHist = prev.slice(0, historyIndex + 1);
                        if (JSON.stringify(newHist[newHist.length - 1]) !== JSON.stringify(newData)) {
                            const updated = [...newHist, newData];
                            setTimeout(() => setHistoryIndex(updated.length - 1), 0);
                            return updated;
                        }
                        return prev;
                    });
                }, 800); 
            };

            const handleUndo = () => {
                // [v1.13 Fix] Clear any pending save operations to prevent overwriting the undo state
                if (historyTimeoutRef.current) clearTimeout(historyTimeoutRef.current);

                    const newIndex = historyIndex - 1;
                    setHistoryIndex(newIndex);
                    _setData(history[newIndex]);
                }
            };

            const handleRedo = () => {
                // [v1.13 Fix] Clear any pending save operations
                if (historyTimeoutRef.current) clearTimeout(historyTimeoutRef.current);

                if (historyIndex < history.length - 1) {
                    const newIndex = historyIndex + 1;
                    setHistoryIndex(newIndex);
                    _setData(history[newIndex]);
                }
            };

            useEffect(() => {

            const shareJsonFile = async () => {

            const handleManualSave = () => { localStorage.setItem('kino_quotation_draft_v2', JSON.stringify(data)); showToast("已儲存至瀏覽器快取"); };
            const getCloudSyncKey = () => {
                return sessionStorage.getItem(CLOUD_AUTH_TOKEN_STORAGE_KEY) || sessionStorage.getItem(CLOUD_SYNC_KEY_STORAGE_KEY) || '';
            };
            const cloudRequest = async (path, options = {}, allowPrompt = true) => {
                const syncKey = getCloudSyncKey();
                if (!syncKey) throw new Error('SYNC_CANCELLED');
                const response = await fetch(`${CLOUD_SYNC_API_URL}${path}`, {
                    ...options,
                    headers: {
                        'content-type': 'application/json',
                        authorization: `Bearer ${syncKey}`,
                        ...(options.headers || {})
                    }
                });
                if (!response.ok) {
                    if (response.status === 401 && sessionStorage.getItem(CLOUD_AUTH_TOKEN_STORAGE_KEY) === syncKey) {
                        sessionStorage.removeItem(CLOUD_AUTH_TOKEN_STORAGE_KEY);
                        sessionStorage.removeItem(CLOUD_AUTH_USER_STORAGE_KEY);

                    const body = await response.json().catch(() => ({}));

                    throw error;

                return response.json();

            useEffect(() => {

                    .then(config => {

            useEffect(() => {

                            auth: {
                                clientId: microsoftClientId,
                                authority: 'https://login.microsoftonline.com/common/',

                                postLogoutRedirectUri: redirectUri,
                                navigateToLoginRequestUrl: false
                            },
                            cache: { cacheLocation: 'sessionStorage' }
                        });
                        await instance.initialize();
                        const redirectResult = await instance.handleRedirectPromise();
                        const account = redirectResult?.account || instance.getAllAccounts()[0] || null;
                        if (account) instance.setActiveAccount(account);
                        msalInstanceRef.current = instance;
                        if (!active) return;
                        setOneDriveAccount(account);
                        setOneDriveStatus('idle');
                        const savedFolder = loadOneDriveFolder();
                        if (savedFolder?.accountHomeId && account && savedFolder.accountHomeId !== account.homeAccountId) {

            useEffect(() => {

                    const response = await fetch(`${CLOUD_SYNC_API_URL}/api/auth/google`, {

                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({ credential })
                    });
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(result.error || 'Google 登入失敗');
                    sessionStorage.setItem(CLOUD_AUTH_TOKEN_STORAGE_KEY, result.token);

                    showToast(error.message || 'Google 登入失敗');

            const logoutCloudAccount = async () => {
                try {
                    if (getCloudSyncKey()) await cloudRequest('/api/auth/logout', { method: 'POST', body: '{}' }, false);

                    console.warn('Cloud logout error', error);
                }
                sessionStorage.removeItem(CLOUD_AUTH_TOKEN_STORAGE_KEY);
                sessionStorage.removeItem(CLOUD_AUTH_USER_STORAGE_KEY);
                setCloudAuthUser(null);
                setCloudAuthStatus('idle');
                setCloudSyncStatus('idle');
                showToast('已登出 Google 帳號');
            };
            const loginOneDrive = async () => {
                if (!microsoftClientId || !msalInstanceRef.current) {
                    showToast('Microsoft 登入設定尚未完成');
                    return;
                }
                setOneDriveStatus('signingIn');
                try {
                    await msalInstanceRef.current.loginRedirect({
                        scopes: ONEDRIVE_SCOPES,
                        prompt: 'select_account'
                    });
                } catch (error) {
                    console.error('OneDrive login error', error);
                    setOneDriveStatus('error');
                    showToast('Microsoft 登入失敗');
                }
            };
            const getOneDriveAccessToken = async (interactive = false) => {
                const instance = msalInstanceRef.current;
                if (!instance) throw new Error('Microsoft 登入尚未初始化');
                const account = instance.getActiveAccount() || oneDriveAccount || instance.getAllAccounts()[0];
                if (!account) {
                    if (interactive) await loginOneDrive();
                    throw new Error('請先登入 Microsoft 帳號');
                }
                instance.setActiveAccount(account);
                try {
                    const result = await instance.acquireTokenSilent({ scopes: ONEDRIVE_SCOPES, account });
                    return result.accessToken;
                } catch (error) {
                    const interactionRequired = error instanceof window.msal.InteractionRequiredAuthError ||
                        ['interaction_required', 'login_required', 'consent_required'].includes(error?.errorCode);
                    if (interactive && interactionRequired) {
                        setOneDriveStatus('signingIn');
                        await instance.acquireTokenRedirect({ scopes: ONEDRIVE_SCOPES, account });
                    }
                    throw error;
                }
            };
            const oneDriveGraphRequest = async (path, options = {}, interactive = true) => {
                const token = await getOneDriveAccessToken(interactive);
                const url = path.startsWith('https://') ? path : `https://graph.microsoft.com/v1.0${path}`;
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        authorization: `Bearer ${token}`,
                        ...(options.headers || {})
                    }
                });
                if (!response.ok) {
                    const body = await response.json().catch(() => ({}));
                    throw new Error(body?.error?.message || `OneDrive 請求失敗 (${response.status})`);
                }
                return response;
            };
            const loadOneDriveFolders = async (targetFolder, nextStack) => {
                setOneDriveFolderLoading(true);
                setOneDriveFolderError('');
                setOneDriveStatus('loading');
                try {
                    const query = '?$select=id,name,folder,parentReference,webUrl&$orderby=name&$top=200';
                    let nextUrl = targetFolder.id === 'root'
                        ? `/me/drive/root/children${query}`
                        : `/me/drive/items/${encodeURIComponent(targetFolder.id)}/children${query}`;
                    const results = [];
                    let pages = 0;
                    while (nextUrl && pages < 10) {
                        const response = await oneDriveGraphRequest(nextUrl);
                        const body = await response.json();
                        results.push(...(Array.isArray(body.value) ? body.value.filter(item => item?.folder) : []));
                        nextUrl = body['@odata.nextLink'] || '';
                        pages += 1;
                    }
                    setOneDriveFolders(results.sort((a, b) => a.name.localeCompare(b.name, 'zh-TW')));
                    if (nextStack) setOneDriveFolderStack(nextStack);
                    setOneDriveStatus('idle');
                } catch (error) {
                    console.error('OneDrive folder load error', error);
                    setOneDriveFolderError(error.message || '無法讀取 OneDrive 資料夾');
                    setOneDriveStatus('error');
                } finally {
                    setOneDriveFolderLoading(false);
                }
            };
            const browseOneDriveRoot = async () => {
                const root = { id: 'root', name: 'OneDrive', path: '/' };
                await loadOneDriveFolders(root, [root]);
            };
            const openOneDriveFolder = async (item) => {
                const parent = oneDriveFolderStack[oneDriveFolderStack.length - 1] || { path: '/' };
                const folderItem = {
                    id: item.id,
                    name: item.name,
                    path: parent.path === '/' ? `/${item.name}` : `${parent.path}/${item.name}`
                };
                await loadOneDriveFolders(folderItem, [...oneDriveFolderStack, folderItem]);
            };
            const goToOneDriveBreadcrumb = async (index) => {
                const nextStack = oneDriveFolderStack.slice(0, index + 1);
                const target = nextStack[nextStack.length - 1];
                if (target) await loadOneDriveFolders(target, nextStack);
            };
            const selectOneDriveFolder = (folder) => {
                const selected = { ...folder, accountHomeId: oneDriveAccount?.homeAccountId || '' };
                setOneDriveFolder(selected);
                setOneDriveAutoSave(true);
                setOneDriveStatus('idle');
                showToast(`OneDrive 資料夾：${selected.path || selected.name}`);
            };
            const saveDataToOneDrive = async ({ silent = false } = {}) => {
                if (!oneDriveAccount || !oneDriveFolder) {
                    if (!silent) setShowOneDriveModal(true);
                    return false;
                }
                setOneDriveStatus('saving');
                try {
                    const fileName = getJsonFileName();
                    const encodedFileName = encodeURIComponent(fileName);
                    const uploadPath = oneDriveFolder.id === 'root'
                        ? `/me/drive/root:/${encodedFileName}:/content`
                        : `/me/drive/items/${encodeURIComponent(oneDriveFolder.id)}:/${encodedFileName}:/content`;
                    const response = await oneDriveGraphRequest(uploadPath, {
                        method: 'PUT',
                        headers: { 'content-type': 'text/plain; charset=utf-8' },
                        body: JSON.stringify(data, null, 2)
                    }, !silent);
                    const savedItem = await response.json();
                    const savedAt = new Date().toISOString();
                    setOneDriveLastSavedAt(savedAt);
                    setOneDriveStatus('saved');
                    if (!silent) showToast(`已存至 OneDrive：${savedItem.name || fileName}`);
                    setTimeout(() => setOneDriveStatus('idle'), 1800);
                    return true;
                } catch (error) {
                    console.error('OneDrive save error', error);
                    setOneDriveStatus('error');
                    if (!silent) showToast(error.message || 'OneDrive 儲存失敗');
                    return false;
                }
            };
            const logoutOneDrive = async () => {
                const instance = msalInstanceRef.current;
                const account = instance?.getActiveAccount() || oneDriveAccount;
                setOneDriveAccount(null);
                setOneDriveAutoSave(false);
                setOneDriveFolder(null);
                setOneDriveStatus('idle');
                if (instance && account) {
                    try {
                        await instance.logoutRedirect({ account });
                    } catch (error) {
                        console.warn('OneDrive logout error', error);
                    }
                }
            };
            const saveRecordToCloud = async (path, record) => {
                if (!getCloudSyncKey()) return;
                try {
                    await cloudRequest(path, { method: 'PUT', body: JSON.stringify(record) }, false);
                    setCloudSyncStatus('success');
                } catch (error) {
                    console.warn('Cloud save error', error);
                    setCloudSyncStatus('error');
                }
            };
            const syncCloudData = async () => {
                if (!getCloudSyncKey()) {
                    setShowCloudKeyModal(true);
                    setCloudSyncStatus('idle');
                    return;
                }
                setCloudSyncStatus('syncing');
                try {
                    const preflight = await cloudRequest('/api/sync');
                    const shouldAdoptRemoteClauses = Boolean(preflight.clauseLibraryInitialized) && !hadLocalClauseLibraryRef.current;
                    const shouldAdoptRemoteCategories = Boolean(preflight.clauseCategoriesInitialized) && !hadLocalClauseCategoriesRef.current;
                    await cloudRequest('/api/sync', {
                        method: 'POST',
                        body: JSON.stringify({
                            projects: projectLibrary,
                            templates: contractTemplates,
                            categories: shouldAdoptRemoteCategories ? [] : clauseCategories,
                            clauses: shouldAdoptRemoteClauses ? [] : clauseLibrary,
                            deletedProjectIds,
                            deletedTemplateIds,
                            deletedCategoryIds: shouldAdoptRemoteCategories ? [] : deletedClauseCategoryIds,
                            deletedClauseIds: shouldAdoptRemoteClauses ? [] : deletedClauseIds,
                            initializeClauseLibrary: !preflight.clauseLibraryInitialized || hadLocalClauseLibraryRef.current,
                            initializeClauseCategories: !preflight.clauseCategoriesInitialized || hadLocalClauseCategoriesRef.current
                        })
                    });
                    setDeletedProjectIds([]);
                    setDeletedTemplateIds([]);
                    setDeletedClauseCategoryIds([]);
                    setDeletedClauseIds([]);
                    const remote = await cloudRequest('/api/sync');
                    const syncedProjects = (Array.isArray(remote.projects) ? remote.projects : [])
                        .filter(project => project?.id && project?.name && project?.data)
                        .map(project => ({ ...project, data: normalizeQuotationData(project.data) }));
                    const syncedTemplates = (Array.isArray(remote.templates) ? remote.templates : [])
                        .filter(template => template?.id && template?.name && Array.isArray(template?.notes));
                    const syncedClauses = sortClauseLibrary((Array.isArray(remote.clauses) ? remote.clauses : [])
                        .map(normalizeClauseRecord)
                        .filter(clause => clause?.text));
                    const syncedCategories = sortClauseCategories((Array.isArray(remote.categories) ? remote.categories : [])
                        .map(normalizeClauseCategoryRecord)
                        .filter(Boolean));
                    setProjectLibrary(syncedProjects);
                    setContractTemplates(syncedTemplates);
                    setClauseCategories(syncedCategories.length ? syncedCategories : buildInitialClauseCategories(syncedClauses));
                    setClauseLibrary(syncedClauses);
                    hadLocalClauseLibraryRef.current = true;
                    hadLocalClauseCategoriesRef.current = true;
                    if (remote.user) {
                        setCloudAuthUser(remote.user);
                        sessionStorage.setItem(CLOUD_AUTH_USER_STORAGE_KEY, JSON.stringify(remote.user));
                    }
                    setCloudSyncStatus('success');
                    showToast(`雲端同步完成：${syncedProjects.length} 個專案、${syncedClauses.length} 條條款`);
                } catch (error) {
                    if (error.message !== 'SYNC_CANCELLED') {
                        console.error('Cloud sync error', error);
                        showToast(error.status === 401 ? '同步金鑰格式不正確，請重新輸入' : '雲端同步失敗，已保留本機資料');
                    }
                    setCloudSyncStatus(error.message === 'SYNC_CANCELLED' ? 'idle' : 'error');
                }
            };
            const saveCloudSyncKey = (syncKey) => {
                if (!syncKey) return;
                sessionStorage.setItem(CLOUD_SYNC_KEY_STORAGE_KEY, syncKey);
                sessionStorage.removeItem(CLOUD_AUTH_TOKEN_STORAGE_KEY);
                sessionStorage.removeItem(CLOUD_AUTH_USER_STORAGE_KEY);
                setCloudAuthUser(null);
                setShowCloudKeyModal(false);
                setTimeout(syncCloudData, 0);
            };
            const createProjectFromManager = (name) => {
                const snapshot = {
                    id: `project-${Date.now()}`,
                    name,
                    updatedAt: new Date().toISOString(),
                    data: normalizeQuotationData(data)
                };
                setProjectLibrary(prev => [snapshot, ...prev]);
                setDeletedProjectIds(prev => prev.filter(id => id !== snapshot.id));
                saveRecordToCloud(`/api/projects/${encodeURIComponent(snapshot.id)}`, snapshot);
                showToast(`已新增專案「${snapshot.name}」`);
            };
            const saveProjectContentFromManager = (projectId) => {
                const current = projectLibrary.find(project => project.id === projectId);
                if (!current) return;
                const updated = { ...current, updatedAt: new Date().toISOString(), data: normalizeQuotationData(data) };
                setProjectLibrary(prev => prev.map(project => project.id === projectId ? updated : project));
                saveRecordToCloud(`/api/projects/${encodeURIComponent(projectId)}`, updated);
                showToast(`已儲存目前內容至「${current.name}」`);
            };
            const renameSavedProject = (projectId, name) => {
                const current = projectLibrary.find(project => project.id === projectId);
                if (!current) return;
                const updated = { ...current, name, updatedAt: new Date().toISOString() };
                setProjectLibrary(prev => prev.map(project => project.id === projectId ? updated : project));
                saveRecordToCloud(`/api/projects/${encodeURIComponent(projectId)}`, updated);
                showToast(`已更新專案名稱為「${name}」`);
            };
            const deleteSavedProject = async (projectId) => {
                const current = projectLibrary.find(project => project.id === projectId);
                if (!current || !confirm(`確定刪除專案「${current.name}」？`)) return;
                setProjectLibrary(prev => prev.filter(project => project.id !== projectId));
                setDeletedProjectIds(prev => [...new Set([...prev, projectId])]);
                if (getCloudSyncKey()) {
                    try {
                        await cloudRequest(`/api/projects/${encodeURIComponent(projectId)}`, { method: 'DELETE' }, false);
                        setDeletedProjectIds(prev => prev.filter(id => id !== projectId));
                    } catch (error) {
                        console.warn('Cloud project delete error', error);
                        setCloudSyncStatus('error');
                    }
                }
                showToast(`已刪除專案「${current.name}」`);
            };
            const loadSavedProject = (projectId) => {
                const savedProject = projectLibrary.find(project => project.id === projectId);
                if (!savedProject) return;
                if (!confirm(`載入「${savedProject.name}」？目前未另存的內容會被取代。`)) return;
                const loadedData = normalizeQuotationData(savedProject.data);
                setData(loadedData);
                setHistory([loadedData]);
                setHistoryIndex(0);
                setFileHandle(null);
                showToast(`已載入本機專案「${savedProject.name}」`);
            };
            const applyPaymentTemplate = (templateId) => {
                const template = PAYMENT_TEMPLATES[templateId];
                if (!template) return;
                setData(prev => ({ ...prev, payment: { terms: JSON.parse(JSON.stringify(template)) } }));
                showToast('已套用付款比例範本');
            };
            const markClauseLibraryLocal = () => {
                hadLocalClauseLibraryRef.current = true;
            };
            const markClauseCategoriesLocal = () => {
                hadLocalClauseCategoriesRef.current = true;
            };
            const importSelectedClauses = (selectedIds) => {
                const selected = sortClauseLibrary(clauseLibrary).filter(clause => selectedIds.includes(clause.id));
                const currentTexts = new Set(data.notes.map(note => (typeof note === 'string' ? note : note?.text || '').trim()).filter(Boolean));
                const additions = selected.filter(clause => !currentTexts.has(clause.text.trim()));
                if (additions.length) {
                    setData(prev => ({
                        ...prev,
                        notes: [...ensureNoteObjects(prev.notes), ...additions.map(clause => ({ id: generateId(), text: clause.text }))]
                    }));
                    showToast(`已匯入 ${additions.length} 條條款`);
                } else {
                    showToast('所選條款已存在，沒有重複加入');
                }
                setShowClausePicker(false);
            };
            const createClauseCategory = (name) => {
                const cleanName = name.trim();
                if (!cleanName) return;
                if (clauseCategories.some(category => category.name === cleanName)) {
                    showToast('已有相同名稱的分類');
                    return;
                }
                const category = {
                    id: `category-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                    name: cleanName,
                    sortOrder: Math.max(0, ...clauseCategories.map(item => Number(item.sortOrder) || 0)) + 1,
                    updatedAt: new Date().toISOString()
                };
                markClauseCategoriesLocal();
                setClauseCategories(prev => sortClauseCategories([...prev, category]));
                setDeletedClauseCategoryIds(prev => prev.filter(id => id !== category.id));
                saveRecordToCloud(`/api/categories/${encodeURIComponent(category.id)}`, category);
                showToast(`已新增分類「${cleanName}」`);
            };
            const saveClauseCategory = (categoryId, name) => {
                const current = clauseCategories.find(category => category.id === categoryId);
                const cleanName = name.trim();
                if (!current || !cleanName) return;
                if (clauseCategories.some(category => category.id !== categoryId && category.name === cleanName)) {
                    showToast('已有相同名稱的分類');
                    return;
                }
                const updatedAt = new Date().toISOString();
                const updated = { ...current, name: cleanName, updatedAt };
                markClauseCategoriesLocal();
                markClauseLibraryLocal();
                setClauseCategories(prev => sortClauseCategories(prev.map(category => category.id === categoryId ? updated : category)));
                setClauseLibrary(prev => sortClauseLibrary(prev.map(clause => clause.categoryId === categoryId ? { ...clause, category: cleanName, updatedAt } : clause)));
                saveRecordToCloud(`/api/categories/${encodeURIComponent(categoryId)}`, updated);
                showToast(`分類已改名為「${cleanName}」`);
            };
            const deleteClauseCategory = async (categoryId) => {
                const current = clauseCategories.find(category => category.id === categoryId);
                if (!current) return;
                const relatedClauses = clauseLibrary.filter(clause => clause.categoryId === categoryId);
                const warning = relatedClauses.length ? `\n\n此分類內的 ${relatedClauses.length} 條條款也會一併刪除。` : '';
                if (!confirm(`確定刪除分類「${current.name}」？${warning}`)) return;
                markClauseCategoriesLocal();
                markClauseLibraryLocal();
                setClauseCategories(prev => prev.filter(category => category.id !== categoryId));
                setClauseLibrary(prev => prev.filter(clause => clause.categoryId !== categoryId));
                setDeletedClauseCategoryIds(prev => [...new Set([...prev, categoryId])]);
                setDeletedClauseIds(prev => [...new Set([...prev, ...relatedClauses.map(clause => clause.id)])]);
                if (getCloudSyncKey()) {
                    try {
                        await cloudRequest(`/api/categories/${encodeURIComponent(categoryId)}`, { method: 'DELETE' }, false);
                        setDeletedClauseCategoryIds(prev => prev.filter(id => id !== categoryId));
                        setDeletedClauseIds(prev => prev.filter(id => !relatedClauses.some(clause => clause.id === id)));
                    } catch (error) {
                        console.warn('Cloud category delete error', error);
                        setCloudSyncStatus('error');
                    }
                }
                showToast(`已刪除分類「${current.name}」`);
            };
            const createClauseRecord = (categoryId, text, severity) => {
                const category = clauseCategories.find(item => item.id === categoryId);
                if (!category) { showToast('請先選擇條款分類'); return; }
                const nextSortOrder = Math.max(0, ...clauseLibrary.filter(clause => !clause.isCore && clause.categoryId === categoryId).map(clause => Number(clause.sortOrder) || 0)) + 1;
                const clause = makeClauseRecord(`clause-${Date.now()}`, category.name, text, severity, nextSortOrder, { categoryId, updatedAt: new Date().toISOString() });
                markClauseLibraryLocal();
                setClauseLibrary(prev => sortClauseLibrary([...prev, clause]));
                setDeletedClauseIds(prev => prev.filter(id => id !== clause.id));
                saveRecordToCloud(`/api/clauses/${encodeURIComponent(clause.id)}`, clause);
                showToast(`已新增「${category.name}」條款`);
            };
            const saveClauseRecord = (clauseId, categoryId, text, severity) => {
                const current = clauseLibrary.find(clause => clause.id === clauseId);
                const category = clauseCategories.find(item => item.id === categoryId);
                if (!current || !category) return;
                const updated = { ...current, categoryId, category: category.name, text, severity, updatedAt: new Date().toISOString() };
                markClauseLibraryLocal();
                setClauseLibrary(prev => sortClauseLibrary(prev.map(clause => clause.id === clauseId ? updated : clause)));
                saveRecordToCloud(`/api/clauses/${encodeURIComponent(clauseId)}`, updated);
                showToast('已儲存條款修改');
            };
            const deleteClauseRecord = async (clauseId) => {
                const current = clauseLibrary.find(clause => clause.id === clauseId);
                if (!current || !confirm(`確定刪除此條款？\n\n${current.text}`)) return;
                markClauseLibraryLocal();
                setClauseLibrary(prev => prev.filter(clause => clause.id !== clauseId));
                setDeletedClauseIds(prev => [...new Set([...prev, clauseId])]);
                if (getCloudSyncKey()) {
                    try {
                        await cloudRequest(`/api/clauses/${encodeURIComponent(clauseId)}`, { method: 'DELETE' }, false);
                        setDeletedClauseIds(prev => prev.filter(id => id !== clauseId));
                    } catch (error) {
                        console.warn('Cloud clause delete error', error);
                        setCloudSyncStatus('error');
                    }
                }
                showToast('已刪除條款');
            };
            const applyContractTemplate = (templateId) => {
                const template = allContractTemplates.find(item => item.id === templateId);
                if (!template) return;
                if (confirm(`套用「${template.name}」？這會取代目前的 ${data.notes.length} 條專案條款。`)) {
                    setData(prev => ({ ...prev, notes: template.notes.map(text => ({ id: generateId(), text })) }));
                    showToast(`已套用「${template.name}」`);
                }
            };
            const saveCurrentContractTemplate = () => {
                const name = prompt('請輸入條款範本名稱：', `專案條款 ${getLocalISODate()}`);
                if (!name?.trim()) return;
                const notes = data.notes.map(note => (typeof note === 'string' ? note : (note?.text || '')).trim()).filter(Boolean);
                if (!notes.length) { showToast('目前沒有可儲存的條款'); return; }
                const template = { id: `custom-${Date.now()}`, name: name.trim(), notes, updatedAt: new Date().toISOString() };
                setContractTemplates(prev => [...prev, template]);
                saveRecordToCloud(`/api/templates/${encodeURIComponent(template.id)}`, template);
                showToast(`已儲存「${name.trim()}」為本機範本`);
            };
            const createContractTemplateFromManager = () => {
                const template = {
                    id: `custom-${Date.now()}`,
                    name: '新條款範本',
                    notes: [''],
                    updatedAt: new Date().toISOString()
                };
                setContractTemplates(prev => [template, ...prev]);
                setDeletedTemplateIds(prev => prev.filter(id => id !== template.id));
                showToast('已新增條款範本，編輯後請按儲存範本');
            };
            const saveContractTemplateRecord = (templateId, name, notes) => {
                const current = contractTemplates.find(template => template.id === templateId);
                if (!current) return;
                const updated = { ...current, name, notes, updatedAt: new Date().toISOString() };
                setContractTemplates(prev => prev.map(template => template.id === templateId ? updated : template));
                saveRecordToCloud(`/api/templates/${encodeURIComponent(templateId)}`, updated);
                showToast(`已儲存條款範本「${name}」`);
            };
            const deleteContractTemplateRecord = async (templateId) => {
                const current = contractTemplates.find(template => template.id === templateId);
                if (!current || !confirm(`確定刪除條款範本「${current.name}」？`)) return;
                setContractTemplates(prev => prev.filter(template => template.id !== templateId));
                setDeletedTemplateIds(prev => [...new Set([...prev, templateId])]);
                if (getCloudSyncKey()) {
                    try {
                        await cloudRequest(`/api/templates/${encodeURIComponent(templateId)}`, { method: 'DELETE' }, false);
                        setDeletedTemplateIds(prev => prev.filter(id => id !== templateId));
                    } catch (error) {
                        console.warn('Cloud template delete error', error);
                        setCloudSyncStatus('error');
                    }
                }
                showToast(`已刪除條款範本「${current.name}」`);
            };
            useEffect(() => {
                if (oneDriveAutoSaveTimerRef.current) clearTimeout(oneDriveAutoSaveTimerRef.current);
                if (!oneDriveAutoSave || !oneDriveAccount || !oneDriveFolder) return;
                oneDriveAutoSaveTimerRef.current = setTimeout(() => {
                    saveDataToOneDrive({ silent: true });
                }, 3000);
                return () => {
                    if (oneDriveAutoSaveTimerRef.current) clearTimeout(oneDriveAutoSaveTimerRef.current);
                };
            }, [data, oneDriveAutoSave, oneDriveAccount?.homeAccountId, oneDriveFolder?.id]);
            const handleReset = () => { if(confirm("確定重置所有內容回到預設值？此動作無法復原。")) { const init = getInitialData(); setData(init); setHistory([init]); setHistoryIndex(0); setFileHandle(null); } };

            return (
                <div className={`quotation-document quotation-${data.quotationType || 'quick'}`} data-quotation-type={data.quotationType || 'quick'}>
                    {toast && <Toast message={toast} />}
                    {showCloudKeyModal && <CloudSyncKeyModal onSave={saveCloudSyncKey} onClose={() => setShowCloudKeyModal(false)} googleClientId={googleClientId} onGoogleCredential={handleGoogleCredential} authUser={cloudAuthUser} onLogout={logoutCloudAccount} authStatus={cloudAuthStatus} />}
                    {showOneDriveModal && <OneDriveModal
                        onClose={() => setShowOneDriveModal(false)}
                        clientId={microsoftClientId}
                        account={oneDriveAccount}
                        folder={oneDriveFolder}
                        autoSave={oneDriveAutoSave}
                        status={oneDriveStatus}
                        lastSavedAt={oneDriveLastSavedAt}
                        folders={oneDriveFolders}
                        folderStack={oneDriveFolderStack}
                        folderLoading={oneDriveFolderLoading}
                        folderError={oneDriveFolderError}
                        onLogin={loginOneDrive}
                        onLogout={logoutOneDrive}
                        onBrowse={browseOneDriveRoot}
                        onOpenFolder={openOneDriveFolder}
                        onGoToBreadcrumb={goToOneDriveBreadcrumb}
                        onSelectFolder={selectOneDriveFolder}
                        onToggleAutoSave={setOneDriveAutoSave}

            const [draggingIdx, setDraggingIdx] = useState(null);
            // [v1.08 Change] Animation Lock to prevent double-click race conditions
            const [isAnimating, setIsAnimating] = useState(false);
            const [toolbarExpanded, setToolbarExpanded] = useState(() => localStorage.getItem('kino_quotation_mobile_toolbar_expanded') === 'true');
            useEffect(() => { localStorage.setItem('kino_quotation_mobile_toolbar_expanded', String(toolbarExpanded)); }, [toolbarExpanded]);

            const scrollTo = (id) => { 
                const el = document.getElementById(id); 
                if (el) { 
                    const headerOffset = 80; 
                    const elementPosition = el.getBoundingClientRect().top; 
                    const offsetPosition = elementPosition + window.pageYOffset - headerOffset; 
                    window.scrollTo({ top: offsetPosition, behavior: "smooth" }); 
                } 
            };
            const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });
            const scrollToBottom = () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            
            // [v1.08 Change] Enhanced moveNote with Visual Animation
            const moveNote = async (index, direction) => {
                if (isAnimating) return; // Block interactions during animation
                if ((direction === 'up' && index === 0) || (direction === 'down' && index === data.notes.length - 1)) return;

                const targetIndex = direction === 'up' ? index - 1 : index + 1;
                
                // Visual Swap Animation Logic
                const currentEl = document.querySelector(`[data-note-index="${index}"]`);
                const targetEl = document.querySelector(`[data-note-index="${targetIndex}"]`);

                if (currentEl && targetEl) {
                    setIsAnimating(true);
                    
                    // Enable transitions
                    currentEl.style.transition = 'transform 0.25s ease-in-out';
                    targetEl.style.transition = 'transform 0.25s ease-in-out';
                    
                    // Calculate visual offset
                    const currentRect = currentEl.getBoundingClientRect();
                    const targetRect = targetEl.getBoundingClientRect();
                    const deltaY = targetRect.y - currentRect.y;

                    // Apply visual move
                    currentEl.style.transform = `translateY(${deltaY}px)`;
                    targetEl.style.transform = `translateY(${-deltaY}px)`; // Move target opposite way

                    // Wait for animation to finish
                    await new Promise(r => setTimeout(r, 250));

                    // Cleanup Styles
                    currentEl.style.transition = '';
                    currentEl.style.transform = '';
                    targetEl.style.transition = '';
                    targetEl.style.transform = '';
                }

                // Perform Actual Data Swap
                const newNotes = [...data.notes];
                if (direction === 'up') {
                    [newNotes[index], newNotes[index - 1]] = [newNotes[index - 1], newNotes[index]]; 
                } else {
                    [newNotes[index], newNotes[index + 1]] = [newNotes[index + 1], newNotes[index]]; 
                }
                setData({...data, notes: newNotes});
                
                setIsAnimating(false);
            };

            // [v1.16 Change] Unified Drag & Drop Logic for Mobile (Touch) and Desktop (Mouse) with Boundary Checks
            const performDragSwap = useCallback((clientY) => {
                if (draggingIdx === null) return;
                
                const cards = document.querySelectorAll('[data-note-index]');
                for (let card of cards) {
                    const rect = card.getBoundingClientRect();
                    if (clientY >= rect.top && clientY <= rect.bottom) {
                        const targetIdx = parseInt(card.dataset.noteIndex);
                        
                        // Added safe boundary checks to prevent errors
                        if (!isNaN(targetIdx) && targetIdx !== draggingIdx && targetIdx >= 0 && targetIdx < data.notes.length) {
                             const newNotes = [...data.notes];
                             
                             // Safety check for splice
                             if (draggingIdx < 0 || draggingIdx >= newNotes.length) break;

                             const [removed] = newNotes.splice(draggingIdx, 1);
                             newNotes.splice(targetIdx, 0, removed);
                             
                             setData({...data, notes: newNotes});
                             setDraggingIdx(targetIdx); 
                             break;
                        }
                    }
                }
            }, [draggingIdx, data.notes, setData]);

            const handleTouchStart = (e, index) => { 
                if(e.cancelable) e.preventDefault();
                setDraggingIdx(index); 
                document.body.style.overflow = 'hidden'; 
            };
            
            const handleTouchMove = (e) => {
                if (draggingIdx === null) return;
                if(e.cancelable) e.preventDefault(); 
                performDragSwap(e.touches[0].clientY);
            };

            const handleTouchEnd = () => { 
                setDraggingIdx(null); 
                document.body.style.overflow = ''; 
            };

            // [v1.16 Change] Desktop Mouse Handlers
            const handleMouseDown = (e, index) => {
                e.preventDefault();
                e.stopPropagation();
                setDraggingIdx(index);
                document.body.style.userSelect = 'none';
                document.body.style.cursor = 'grabbing';
            };

            useEffect(() => {
                if (draggingIdx === null) return;

                const handleWindowMouseMove = (e) => {
                    e.preventDefault();
                    performDragSwap(e.clientY);
                };

                const handleWindowMouseUp = () => {
                    setDraggingIdx(null);
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                };

                window.addEventListener('mousemove', handleWindowMouseMove);
                window.addEventListener('mouseup', handleWindowMouseUp);

                return () => {
                    window.removeEventListener('mousemove', handleWindowMouseMove);
                    window.removeEventListener('mouseup', handleWindowMouseUp);
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                };
            }, [draggingIdx, performDragSwap]);

            return (
                <div className="bg-gray-100 min-h-screen pb-20 relative sm:max-w-[480px] sm:mx-auto sm:shadow-2xl sm:border-x sm:border-gray-200 sm:min-h-screen">

                                <button onClick={handleSaveAs} aria-label="另存 JSON" title="另存 JSON" className="qt-toolbar-control qt-toolbar-button w-9 bg-kino-light px-0 text-white"><i className="fas fa-download"></i></button>
                                <button onClick={undo} disabled={!canUndo} aria-label="返回" title="返回" className={`qt-toolbar-control qt-toolbar-button w-9 px-0 ${canUndo ? 'text-kino hover:bg-gray-100' : 'cursor-not-allowed text-gray-300'}`}><i className="fas fa-undo"></i></button>
                                <button onClick={handleOpen} aria-label="開啟 JSON" title="開啟 JSON" className="qt-toolbar-control qt-toolbar-button w-9 px-0 text-kino hover:bg-gray-100"><i className="fas fa-folder-open"></i></button>
                                <button onClick={handleSave} aria-label="儲存或分享 JSON" title="儲存或分享 JSON" className="qt-toolbar-control qt-toolbar-button w-9 bg-kino px-0 text-white"><i className="fas fa-save"></i></button>
                                <button onClick={handleReset} aria-label="重設報價" title="重設報價" className="qt-toolbar-control qt-toolbar-button w-9 px-0 text-red-500 hover:bg-red-50"><i className="fas fa-undo"></i></button>

                            <div className="flex justify-between items-center"><h2 className="text-kino font-bold text-lg">服務細項報價</h2><button className="bg-kino text-white text-xs px-3 py-1 rounded-full shadow" onClick={() => { const id = generateId(); setData({...data, categories: [...data.categories, {id, name: "新分類"}], items: {...data.items, [id]: []}}); }}>+ 分類</button></div>
                            <p className="text-xs text-gray-500 -mt-2">{QUOTATION_TYPES[data.quotationType || 'quick'].editorHint}</p>
                            {data.categories.map((cat, idx) => { const sectionTotal = (data.items[cat.id] || []).reduce((acc, item) => acc + (item.qty * item.price), 0); return (<div key={cat.id} className="bg-white rounded-xl shadow-sm overflow-hidden"><div className="bg-kino-light p-3 flex justify-between items-center text-white"><input className="bg-transparent font-bold w-2/3 focus:outline-none" value={cat.name} onChange={e => { const newC = data.categories.map(c => c.id === cat.id ? {...c, name: e.target.value} : c); setData({...data, categories: newC}); }} /><div className="text-xs">{formatCurrency(sectionTotal)}</div></div><div className="p-3 space-y-3">{(data.items[cat.id] || []).map((item, i) => (<div key={i} className="bg-gray-50 rounded-lg p-3 relative border border-gray-100"><input className="w-full font-medium text-gray-800 mb-2 bg-transparent border-b border-dashed border-gray-300 focus:outline-none pb-1" value={item.desc} placeholder="項目描述" onChange={e => { const newItems = [...data.items[cat.id]]; newItems[i].desc = e.target.value; setData({...data, items: {...data.items, [cat.id]: newItems}}); }} /><div className="flex gap-2 mb-2"><div className="w-1/3"><label className="text-[10px] text-gray-500">單價</label><input type="number" className="w-full text-sm font-bold text-gray-700 bg-white rounded border border-gray-200 px-1" value={item.price} onChange={e => { const newItems = [...data.items[cat.id]]; newItems[i].price = parseInt(e.target.value)||0; setData({...data, items: {...data.items, [cat.id]: newItems}}); }} /></div><div className="w-1/4"><label className="text-[10px] text-gray-500">數量</label><input type="number" className="w-full text-sm text-center bg-white rounded border border-gray-200 px-1" value={item.qty} onChange={e => { const newItems = [...data.items[cat.id]]; newItems[i].qty = parseInt(e.target.value)||0; setData({...data, items: {...data.items, [cat.id]: newItems}}); }} /></div><div className="w-1/4"><label className="text-[10px] text-gray-500">單位</label><input className="w-full text-sm text-center bg-white rounded border border-gray-200 px-1" value={item.unit} onChange={e => { const newItems = [...data.items[cat.id]]; newItems[i].unit = e.target.value; setData({...data, items: {...data.items, [cat.id]: newItems}}); }} /></div></div><div className="flex justify-between items-end border-t border-gray-200 pt-2 mt-2"><span className="text-xs text-gray-400">小計: {formatCurrency(item.qty * item.price)}</span><button className="text-red-400 p-1" onClick={() => { const newItems = data.items[cat.id].filter((_, index) => index !== i); setData({...data, items: {...data.items, [cat.id]: newItems}}); }}><i className="fas fa-trash"></i></button></div></div>))}<button className="w-full py-2 bg-gray-100 text-gray-500 text-xs rounded-lg font-bold hover:bg-gray-200" onClick={() => { const newItems = [...(data.items[cat.id] || []), {desc: "新項目", qty: 1, unit: "式", price: 0}]; setData({...data, items: {...data.items, [cat.id]: newItems}}); }}>+ 新增項目</button></div></div>)})}
                        </div>
                        <div id="m-print" className="bg-gray-800 text-white p-4 rounded-xl shadow-lg mt-8 mobile-section">
                            <h2 className="font-bold border-b border-gray-600 pb-2 mb-3"><i className="fas fa-print mr-2"></i>列印與輸出設定</h2>
                            <QuotationTypeSelector data={data} setData={setData} compact={true} />
                            <label className="flex items-center space-x-2 text-sm select-none cursor-pointer my-4"><input type="checkbox" checked={data.printSettings.showSigDate} onChange={e => updateField('printSettings', 'showSigDate', e.target.checked)} className="text-kino" /><span>包含簽署日期</span></label>
                            <button onClick={handlePrint} className="w-full bg-white text-gray-900 font-bold py-3 rounded-lg hover:bg-gray-200 transition">列印</button>
                            <p className="text-xs text-gray-400 mt-2 text-center">快速報價固定單頁。</p>
                        </div>
                        <div className="h-20"></div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
