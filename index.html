    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+CJK+TC:wght@400;500;700&display=swap');
        
        body { font-family: 'Inter', 'Noto Sans CJK TC', sans-serif; background-color: #f4f7f9; }
        
        /* 螢幕顯示時隱藏 print-only 元素 */
        .print-only { display: none; }

        /* [v1.09 Change] Robust Footer Background Control */
        .footer-total-area {
            background-color: #f9fafb; /* Screen: Gray 50 */
            border-top: 1px solid #e5e7eb;
        }

        /* Toast Animation */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            pointer-events: none;
            animation: fadeInOut 2s ease-in-out forwards;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* [V53 Change] 列印核心邏輯修正 */
        @media print {
            /* A4 安全邊界：保留印表機裁切空間，同時提高單頁可用高度。 */
            @page { size: A4; margin: 8mm; }
            body { background: white; -webkit-print-color-adjust: exact; margin: 0; padding: 0; }
            
            .no-print { display: none !important; }
            .print-only { display: block !important; }

            /* [v1.10 Change] Force Footer Background to #F9FAFB in Print */
            .footer-total-area {
                background-color: #F9FAFB !important; /* 強制設定為您指定的顏色 */
                border-top: 1px solid #808080 !important;
                -webkit-print-color-adjust: exact !important; /* 強制瀏覽器列印背景色 */
                print-color-adjust: exact !important;
            }

            #mobile-root { display: none !important; }
            #desktop-root { 
                display: block !important; 
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                /* [Fix] 移除背景色，避免出現灰色區塊 */
                background-color: white !important;
            }
            
            /* [Fix] 強制移除背景色類別的影響 */
            .bg-gray-100 {
                background-color: white !important;
            }

            .desktop-wrapper { padding: 0 !important; margin: 0 !important; }
            .page-container { 
                box-shadow: none !important; 
                border: none !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                width: 100% !important; 
                max-width: none !important;
                /* [Fix] 列印時移除圓角，避免與背景色產生視覺落差 */
                border-radius: 0 !important;
            }

            /* 輸入框列印基礎設定 */
            input, textarea, select {
                border: none !important;
                background: transparent !important;
                resize: none;
                padding: 0 !important;
                appearance: none; 
                box-shadow: none !important;
                line-height: 1.3 !important; 
            }
            .input-bg-print-remove {
                background-color: transparent !important;
                border: none !important;
                padding: 0 !important;
            }
            
            /* 表格列印優化 */
            table { border-collapse: separate !important; border-spacing: 0; width: 100% !important; margin-bottom: 0 !important; border: none !important; }
            
            /* 表格高度異常，強制 auto */
            tr, td { height: auto !important; }

            /* [v1.05 Change] Print Table Borders to 50% Gray (#808080) */
            .print-table-container {
                border: 1px solid #808080 !important;
                border-radius: 8px !important;
                overflow: hidden !important;
                margin-bottom: 12px !important;
                background-color: transparent !important;
                box-shadow: none !important;
            }

            /* 線條粗細不均修正 - Gray Borders */
            th, td { 
                border-bottom: 1px solid #808080 !important; 
                border-right: 1px solid #808080 !important; 
                padding: 4px 6px !important; 
                vertical-align: middle; 
            }
            tr:last-child td { border-bottom: none !important; }
            th:last-child, td:last-child { border-right: none !important; }

            th { background-color: #105482 !important; color: white !important; font-weight: bold !important; text-align: center; -webkit-print-color-adjust: exact; }
            
            /* 摘要表格內文改為 9pt */
            .summary-table th, .summary-table td { font-size: 9pt !important; }
            
            /* 細項表格維持原樣或微調 */
            .item-table th, .item-table td { font-size: 9pt !important; }
            
            /* [v1.03 Change] VI. Detailed Services Print Styles */
            /* Force Header to be Light Blue */
            .item-table thead th {
                background-color: #f0f6fa !important; /* kino-50 */
                color: #000 !important; /* Black text for readability on light blue */
                font-weight: bold !important;
                border-bottom: 1px solid #808080 !important; /* Gray border */
            }
            /* Remove any existing gray backgrounds from body rows */
            .item-table tbody tr {
                background-color: transparent !important;
            }

            /* 表頭資訊 (單號、日期、有效期限) 改為 11pt */
            .print-header-info input { font-size: 11pt !important; height: auto !important; }
            .print-header-info label { font-size: 10pt !important; }

            /* 客製化細節字級改為 9pt */
            .print-list-number {
                margin-right: 4px !important;
                font-weight: bold !important;
                min-width: 18px !important;
                margin-top: 0 !important; /* [Fix] Remove top margin to align with text */
                font-size: 9pt !important; 
                line-height: 1.5 !important; /* [Fix] Match text line-height */
                /* 項目符號改為標準藍色 */
                color: #105482 !important; 
            }
            
            /* [v1.05 Change] III. Customization Details Content Style - Reset individual item styles */
            .print-list-text-div {
                padding: 0 !important;
                margin: 0 !important;
                font-size: 9pt !important;
                line-height: 1.5 !important;
                white-space: pre-wrap !important;
                text-align: justify !important;
                background-color: transparent !important; /* Removed specific background */
                border-radius: 0 !important; /* Removed radius */
                display: block !important;
            }
            
            /* 服務細項標題字級縮小 */
            .print-category-header h3 { font-size: 10pt !important; }
            /* 桌面版標題編輯時的列印樣式修正 */
            .print-category-header input { 
                font-size: 10pt !important; 
                color: white !important; 
                font-weight: bold !important;
                width: 100%;
            }

            /* 簽署區內文全藍 */
            .signature-table input { color: #105482 !important; font-weight: bold !important; }
            .signature-table td { color: #105482 !important; } 
            .signature-table .text-black { color: #000 !important; } 

            /* [v1.01 Change] 簽署欄位 - TD 設定 (列印模式改為 200px) */
            .print-signature-row { 
                height: 200px !important; 
                vertical-align: middle !important; 
                padding: 0 !important; 
            }
            
            /* [v1.01 Change] 簽署欄位 - 內部容器強制高度 (列印模式改為 200px) */
            .signature-cell-inner {
                height: 200px !important; 
                width: 100%;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                overflow: hidden !important;
                padding: 0 !important;
            }

            /* [V53 Change] 圖片限縮：保留 5% 留白 (max 90%) */
            .signature-cell-inner img {
                max-height: 90% !important;
                max-width: 90% !important; 
                object-fit: contain !important;
            }

            /* 服務項目總計 (∆) 縮小 */
            .print-summary-text-sm { font-size: 11pt !important; }
            
            /* [v1.02 Change] Removed transparent background forcing here to fix Main Total visibility */
            .print-summary-val-sm { 
                font-size: 11pt !important; 
            }
            
            /* [v1.06 Change] detailed-services-footer: Force white background */
            .detailed-services-footer {
                background-color: white !important; 
                border-top: 1px solid #808080 !important;
                color: #000 !important;
                box-shadow: none !important;
            }

            /* [V53 Change] 強制分頁設定 - 修復邏輯，只負責分頁，不隱藏內容 */
            .page-break-before-always { 
                break-before: page; 
                page-break-before: always; 
                display: block; /* 確保內容可見 */
            }
            
            /* [Ver 1.0 Change] Remove top border for Detailed Services in print */
            .detailed-section {
                border-top: none !important;
                padding-top: 0 !important;
            }
            
            /* 條件分頁 (三與四之間) */
            .section-3-4-break { break-before: page; page-break-before: always; }
            .print-scaled .section-3-4-break { break-before: auto; page-break-before: auto; }

            .section-block { break-inside: avoid; margin-bottom: 10px !important; }
            h1, h2, h3 { break-after: avoid; }
            
            /* 快速報價：專用 A4 結構，以雙欄分配內容，不縮放整張文件。 */
            .quotation-quick { zoom: 1 !important; }
            .quotation-quick .standard-document-content { display: none !important; }
            .quotation-quick .quick-print-sheet { display: block !important; }
            .quotation-quick .page-container { min-height: 0 !important; }
            .quotation-quick #desktop-root > .bg-gray-100 {
                min-height: 0 !important;
                padding-bottom: 0 !important;
            }

            .quick-print-sheet {
                color: #182230;
                font-size: 9pt;
                line-height: 1.3;
            }
            .quick-print-header {
                display: grid;
                grid-template-columns: 34mm 1fr;
                align-items: center;
                min-height: 12mm;
                padding-bottom: 1.5mm;
                border-bottom: 1px solid #d0d5dd;
            }
            .quick-print-logo { max-width: 30mm; max-height: 13mm; object-fit: contain; }
            .quick-print-title { text-align: right; }
            .quick-print-title h1 { margin: 1mm 0 0; font-size: 18pt; line-height: 1.05; font-weight: 800; letter-spacing: .02em; }
            .quick-print-badge {
                display: block;
                margin: 0;
                padding: 0;
                background: transparent;
                color: #105482;
                font-size: 7.5pt;
                font-weight: 700;
                letter-spacing: .16em;
            }
            .quick-print-meta {
                display: grid;
                /* 有效期限的左邊界對齊專案概況第二欄；日期縮窄，空間留給單號。 */
                grid-template-columns: 66.25mm 27mm minmax(0, 1fr);
                gap: 2.5mm;
                padding: 1.2mm 0;
            }
            .quick-print-meta > div { min-width: 0; padding: .8mm 2mm; border-radius: 2mm; background: #f2f6f9; font-size: 7.5pt; line-height: 1.2; }
            .quick-print-meta strong { display: block; margin: 0 0 .35mm; color: #667085; font-size: 7pt; line-height: 1.1; letter-spacing: .06em; }
            .quick-print-validity { overflow-wrap: anywhere; }
            .quick-print-flow { display: block; }
            .quick-print-section { break-inside: avoid; page-break-inside: avoid; }
            .quick-print-section + .quick-print-section { margin-top: 1.8mm; }
            .quick-print-section h2 {
                margin: 0 0 .8mm;
                padding: .8mm 2mm;
                border: 0;
                border-radius: 1.8mm;
                background: #eaf2f7;
                color: #105482;
                font-size: 8pt;
                line-height: 1.15;
                font-weight: 700;
                letter-spacing: .12em;
            }
            .quick-project-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2mm 2.5mm; }
            .quick-project-item { display: grid; grid-template-columns: 22mm 1fr; min-width: 0; padding: .6mm 2mm; border: 0; border-radius: 1.5mm; background: #f7f9fb; }
            .quick-project-item strong { color: #667085; font-size: 8pt; font-weight: 600; }
            .quick-summary-list { display: grid; gap: .7mm; font-size: 8.8pt; }
            /* 數量欄起點與右側專案欄的「值」起點對齊：半欄 + 類別標籤寬度。 */
            .quick-summary-row { display: grid; grid-template-columns: calc((100% - 2.5mm) / 2 + 21.5mm) 20mm minmax(0, 1fr); gap: 3mm; padding: .4mm 2mm; border: 0; border-radius: 1.3mm; background: #f7f9fb; }
            .quick-summary-quantity { min-width: 20mm; color: #105482; text-align: center; font-weight: 700; white-space: nowrap; }
            .quick-summary-row span:last-child { color: #667085; text-align: right; white-space: nowrap; }
            .quick-print-total {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                margin-top: .8mm;
                padding: 1mm 2mm;
                border: 0;
                border-radius: 1.8mm;
                background: #eaf2f7;
                color: #105482;
                font-weight: 700;
            }
            .quick-print-total strong { font-size: 14pt; letter-spacing: .02em; }
            .quick-print-terms { margin: 0; padding-left: 6mm; list-style: decimal; font-size: 8.8pt; line-height: 1.34; }
            .quick-print-terms li { margin-bottom: .4mm; padding-left: 1mm; }
            .quick-print-terms li::marker { color: #105482; font-weight: 700; }
            .quick-payment-list { display: grid; gap: 0; border: 1px solid #d8e2e9; border-radius: 2mm; overflow: hidden; }
            .quick-payment-header,
            .quick-payment-row {
                display: grid;
                grid-template-columns: 31mm 14mm minmax(0, 1fr) 36mm;
                gap: 3mm;
                align-items: center;
                border: 0;
            }
            .quick-payment-header {
                padding: .7mm 2mm;
                background: #105482;
                color: white;
                font-size: 7.5pt;
                font-weight: 700;
                letter-spacing: .04em;

            .quick-payment-row { padding: .7mm 2mm; }
            .quick-payment-row:nth-child(odd) { background: #f4f7f9; }
            .quick-payment-header > span,
            .quick-payment-row > * { text-align: center !important; }
            .quick-payment-percent { color: #105482; text-align: center; font-weight: 800; }
            .quick-payment-condition,
            .quick-payment-note { color: #4b5563; font-size: 8.1pt; line-height: 1.25; text-align: center; }
            .quick-bank {
                margin-top: 2mm;
                padding: 1.2mm 2mm;
                border: 0;
                border-radius: 2mm;
                background: #f2f6f9;
                font-size: 8.5pt;
                line-height: 1.35;

            .quick-acceptance-table tbody tr:last-child > * { border-bottom: 0 !important; }

        /* 桌面工作區預覽使用 3 cm 簽署列；輸出高度另由列印樣式校準。 */

            };
            const drawTo = (point) => {
                const canvas = canvasRef.current;
                const context = canvas?.getContext('2d');
                if (!context || !pointRef.current) return;
                context.lineCap = 'round';

                context.strokeStyle = '#113850';

                context.beginPath();

                    img.src = event.target.result; 
                    img.onload = () => { 
                        const canvas = document.createElement('canvas'); 
                        const MAX_WIDTH = 800; 
                        let width = img.width; 
                        let height = img.height; 
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } 
                        canvas.width = width; 
                        canvas.height = height; 
                        const ctx = canvas.getContext('2d'); 
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height); 
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                    }; 
                }; 
            });

                        setFileHandle(handle); 
                        showToast(`檔案 ${file.name} 開啟成功`);
                    } catch (e) { if(e.name !== 'AbortError') console.error(e); }
                } else {
                    document.getElementById('hidden-file-input').click();
                }
            };

            const handleSave = async () => {
                if (fileHandle && 'showOpenFilePicker' in window) {
                    try {
                        const writable = await fileHandle.createWritable();
                        await writable.write(JSON.stringify(data, null, 2));
                        await writable.close();
                        showToast('儲存成功 (原檔覆蓋)');
                    } catch(e) { console.error(e); showToast('儲存失敗'); }
                } else {
                    handleSaveAs();
                }
            };

            const handleSaveAs = async () => {
                if ('showSaveFilePicker' in window) {
                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: `${data.header.quotationId || 'quotation'}.json`,
                            types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }],
                        });
                        const writable = await handle.createWritable();
                        await writable.write(JSON.stringify(data, null, 2));
                        await writable.close();
                        setFileHandle(handle);
                        showToast('另存成功');
                    } catch (e) { if(e.name !== 'AbortError') console.error(e); }
                } else {
                    const fileName = `${data.header.quotationId || 'quotation'}.json`;
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            };

            const handleLegacyLoad = (e) => {
                const file = e.target.files[0]; 
                if (!file) return; 
                const reader = new FileReader(); 
                reader.onload = (evt) => { 
                    try { 
                        const parsed = JSON.parse(evt.target.result); 
                        const loadedData = normalizeQuotationData(parsed);

                        setData(loadedData);
                        setHistory([loadedData]);
                        setHistoryIndex(0); 
                        showToast(`檔案 ${file.name} 載入成功`); 
                    } catch (err) { showToast("檔案格式錯誤"); } 
                }; 
                reader.readAsText(file); 
            };
            const handleManualSave = () => { localStorage.setItem('kino_quotation_draft_v2', JSON.stringify(data)); showToast("已儲存至瀏覽器快取"); };
            const getSuggestedProjectName = () => {
                const projectName = data.project.find(item => item.label.includes('專案名稱') || item.label === '名稱')?.value?.trim();
                return projectName || data.header.quotationId || `專案 ${getLocalISODate()}`;
            };
            const saveCurrentProject = () => {
                const name = prompt('請輸入本機專案名稱：', getSuggestedProjectName());
                if (!name?.trim()) return;
                const existing = projectLibrary.find(project => project.name === name.trim());
                if (existing && !confirm(`「${name.trim()}」已存在，要更新為目前內容嗎？`)) return;
                const snapshot = { id: existing?.id || `project-${Date.now()}`, name: name.trim(), updatedAt: new Date().toISOString(), data: normalizeQuotationData(data) };
                setProjectLibrary(prev => [snapshot, ...prev.filter(project => project.id !== snapshot.id)]);
                showToast(`已儲存本機專案「${snapshot.name}」`);
            };
            const loadSavedProject = (projectId) => {
                const savedProject = projectLibrary.find(project => project.id === projectId);
                if (!savedProject) return;
                if (!confirm(`載入「${savedProject.name}」？目前未另存的內容會被取代。`)) return;
                const loadedData = normalizeQuotationData(savedProject.data);
                setData(loadedData);
                setHistory([loadedData]);
                setHistoryIndex(0);
                setFileHandle(null);
                showToast(`已載入本機專案「${savedProject.name}」`);
            };
            const applyPaymentTemplate = (templateId) => {
                const template = PAYMENT_TEMPLATES[templateId];
                if (!template) return;
                if (!confirm('套用此付款比例？目前付款條件會被取代。')) return;
                setData(prev => ({ ...prev, payment: { terms: JSON.parse(JSON.stringify(template)) } }));
                showToast('已套用付款比例範本');
            };
            const applyContractTemplate = (templateId) => {
                const template = allContractTemplates.find(item => item.id === templateId);
                if (!template) return;
                if (confirm(`套用「${template.name}」？這會取代目前的 ${data.notes.length} 條專案條款。`)) {
                    setData(prev => ({ ...prev, notes: template.notes.map(text => ({ id: generateId(), text })) }));
                    showToast(`已套用「${template.name}」`);
                }
            };
            const saveCurrentContractTemplate = () => {
                const name = prompt('請輸入條款範本名稱：', `專案條款 ${getLocalISODate()}`);
                if (!name?.trim()) return;
                const notes = data.notes.map(note => (typeof note === 'string' ? note : (note?.text || '')).trim()).filter(Boolean);
                if (!notes.length) { showToast('目前沒有可儲存的條款'); return; }
                setContractTemplates(prev => [...prev, { id: `custom-${Date.now()}`, name: name.trim(), notes }]);
                showToast(`已儲存「${name.trim()}」為本機範本`);
            };
            const handleReset = () => { if(confirm("確定重置所有內容回到預設值？此動作無法復原。")) { const init = getInitialData(); setData(init); setHistory([init]); setHistoryIndex(0); setFileHandle(null); } };

            return (
                <div className={`quotation-document quotation-${data.quotationType || 'quick'}`} data-quotation-type={data.quotationType || 'quick'}>
                    {toast && <Toast message={toast} />}
                    <input type="file" id="hidden-file-input" className="hidden" accept=".json" onChange={handleLegacyLoad} />

                    <div id="desktop-root" style={{ display: mode === 'desktop' ? 'block' : 'none' }}>
                        <DesktopView 
                            data={data} setData={setData} updateField={updateField} calcs={calculations} compressImage={compressImage} 
                            handleOpen={handleOpen} handleSave={handleSave} handleSaveAs={handleSaveAs} handleReset={handleReset} handleManualSave={handleManualSave}
                            contractTemplates={allContractTemplates} applyContractTemplate={applyContractTemplate} saveCurrentContractTemplate={saveCurrentContractTemplate}
                            projectLibrary={projectLibrary} loadSavedProject={loadSavedProject} saveCurrentProject={saveCurrentProject}
                            applyPaymentTemplate={applyPaymentTemplate}
                            mode={mode}
                            undo={handleUndo} redo={handleRedo} canUndo={historyIndex > 0} canRedo={historyIndex < history.length - 1}
                        />
                    </div>
                    
                    <div id="mobile-root" style={{ display: mode === 'mobile' ? 'block' : 'none' }}>
                        <MobileView 
                            data={data} setData={setData} updateField={updateField} calcs={calculations} compressImage={compressImage} 
                            handleOpen={handleOpen} handleSave={handleSave} handleReset={handleReset} mode={mode}
                            contractTemplates={allContractTemplates} applyContractTemplate={applyContractTemplate} saveCurrentContractTemplate={saveCurrentContractTemplate}
                            projectLibrary={projectLibrary} loadSavedProject={loadSavedProject} saveCurrentProject={saveCurrentProject}
                            applyPaymentTemplate={applyPaymentTemplate}
                        />
                    </div>
                </div>
            );
        };

        const QuickPrintView = ({ data, calcs }) => {
            const categories = Array.isArray(data.categories) ? data.categories : [];
            const project = Array.isArray(data.project) ? data.project : [];
            const notes = Array.isArray(data.notes) ? data.notes : [];
            const paymentTerms = Array.isArray(data.payment?.terms) ? data.payment.terms : [];
            const taxLabel = data.taxMode === 'included' ? '稅外加 5%' : (data.taxMode === 'inclusive_flat' ? '含稅' : '未稅');
            const quickTitle = (data.header.title || '奇諾影像報價單').replace(/\s*\(Quotation\)\s*/i, '');
            const printModeLabel = data.quotationType === 'detailed' ? 'DETAILED QUOTATION' : 'QUICK QUOTATION';

            return (
                <article className="quick-print-sheet print-only" aria-label="快速報價列印版">
                    <header className="quick-print-header">
                        <div>{data.logo && <img src={data.logo} className="quick-print-logo" alt="公司標誌" />}</div>
                        <div className="quick-print-title">
                            <span className="quick-print-badge">{printModeLabel}</span>
                            <h1>{quickTitle}</h1>
                        </div>
                    </header>

                    <div className="quick-print-meta">
                        <div><strong>報價單號</strong>{data.header.quotationId || '—'}</div>
                        <div><strong>報價日期</strong>{data.header.quotationDate || '—'}</div>
                        <div className="quick-print-validity"><strong>有效期限</strong>{data.header.validity || '—'}</div>
                    </div>

                    <div className="quick-print-flow">
                        <section className="quick-print-section">
                            <h2>PROJECT / 專案概況</h2>
                            <div className="quick-project-list">
                                {project.map((item, index) => (
                                    <div className="quick-project-item" key={index}>
                                        <strong>{item.label || '項目'}：</strong>{item.value || '—'}
                                    </div>
                                ))}
                            </div>
                        </section>

                        <section className="quick-print-section">
                            <h2>QUOTATION / 報價摘要</h2>
                            <div className="quick-summary-list">
                                {categories.map(category => {
                                    const subtotal = (data.items[category.id] || []).reduce((sum, item) => sum + (item.qty * item.price), 0);
                                    const summaryQuantity = [category.summaryQty, category.summaryUnit].filter(value => String(value ?? '').trim()).join(' ');
                                    return <div className="quick-summary-row" key={category.id}><span>{category.name}</span><span className="quick-summary-quantity">{summaryQuantity}</span><span>{formatCurrency(subtotal)}</span></div>;
                                })}
                            </div>
                            <div className="quick-print-total"><span>報價總額（{taxLabel}）</span><strong>NT$ {formatCurrency(calcs.grandTotal)}</strong></div>
                        </section>
                        <section className="quick-print-section">
                            <h2>TERMS / 專案條款</h2>
                            <ol className="quick-print-terms">
                                {notes.map((note, index) => <li key={note.id || index}>{typeof note === 'string' ? note : (note?.text || '')}</li>)}
                            </ol>
                        </section>

                        <section className="quick-print-section">
                                <h2>PAYMENT / 付款方式</h2>
                                <div className="quick-payment-list">
                                    <div className="quick-payment-header" aria-hidden="true">
                                        <span>階段</span><span style={{textAlign: 'right'}}>比例</span><span>付款條件</span><span>備註</span>
                                    </div>
                                    {paymentTerms.map((term, index) => (
                                        <div className="quick-payment-row" key={index}>
                                            <strong>{term.phase || `第 ${index + 1} 期`}</strong>
                                            <span className="quick-payment-percent">{term.percent}</span>
                                            <div className="quick-payment-condition">{term.condition}</div>
                                            <div className="quick-payment-note">{term.notes || '—'}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="quick-bank">
                                    <strong className="quick-bank-title">乙方收款資訊</strong>
                                    <div className="quick-bank-grid">
                                        <div className="quick-bank-item"><span>戶名</span><strong>{data.bank.accountName || '—'}</strong></div>
                                        <div className="quick-bank-item"><span>銀行</span><strong>{data.bank.bankName || '—'}</strong></div>
                                        <div className="quick-bank-item"><span>帳號</span><strong>{data.bank.accountNumber || '—'}</strong></div>
                                    </div>
                                </div>
                                <p className="quick-print-warning">逾期付款：若甲方逾期或未足額支付，乙方得暫停後續製作或交付，直至款項結清。</p>
                        </section>

                        <section className="quick-print-section">
                                <h2>ACCEPTANCE / 報價確認</h2>
                                <div className="quick-acceptance-wrap">
                                    <table className="quick-acceptance-table">
                                        <colgroup>
                                            <col className="quick-acceptance-label-col" />
                                            <col className="quick-acceptance-party-col" />
                                            <col className="quick-acceptance-party-col" />
                                        </colgroup>
                                        <thead><tr><th></th><th>甲方</th><th>乙方</th></tr></thead>
                                        <tbody>
                                            <tr><th>抬頭</th><td>{data.signature.clientCompany || '　'}</td><td>{data.signature.vendorCompany || '　'}</td></tr>
                                            <tr><th>代表人</th><td>{data.signature.clientContact || '　'}</td><td>{data.signature.vendorContact || '　'}</td></tr>
                                            <tr><th>統編</th><td>{data.signature.clientTaxId || '　'}</td><td>{data.signature.vendorTaxId || '　'}</td></tr>
                                            <tr><th>電話</th><td>{data.signature.clientPhone || '　'}</td><td>{data.signature.vendorPhone || '　'}</td></tr>
                                            <tr>
                                                <th>簽署</th>
                                                <td><div className="quick-acceptance-signature">{data.signature.clientSigImg ? <img src={data.signature.clientSigImg} alt="甲方簽名" /> : <span className="quick-acceptance-signature-placeholder">簽章</span>}</div></td>
                                                <td><div className="quick-acceptance-signature">{data.signature.vendorSigImg ? <img src={data.signature.vendorSigImg} alt="乙方簽名" /> : <span className="quick-acceptance-signature-placeholder">簽章</span>}</div></td>
                                            </tr>
                                            {data.printSettings.showSigDate && <tr><th>日期</th><td colSpan="2">{data.signature.signatureDate || '　　　　'}</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                        </section>
                    </div>

                    <footer className="quick-print-footer"><span>KINO STUDIO / {printModeLabel}</span><span>01 / {data.quotationType === 'detailed' ? '02+' : '01'}</span></footer>
                </article>
            );
        };

        const DesktopView = ({ data, setData, updateField, calcs, compressImage, handleOpen, handleSave, handleSaveAs, handleReset, handleManualSave, contractTemplates, applyContractTemplate, saveCurrentContractTemplate, projectLibrary, loadSavedProject, saveCurrentProject, applyPaymentTemplate, mode, undo, redo, canUndo, canRedo }) => {
            const handleLogoUpload = async (e) => { if (e.target.files[0]) { const base64 = await compressImage(e.target.files[0]); setData(prev => ({ ...prev, logo: base64 })); } };
            const [draggedNoteId, setDraggedNoteId] = useState(null);
            const [dragOverNoteId, setDragOverNoteId] = useState(null);
            const [recentlyMovedNoteId, setRecentlyMovedNoteId] = useState(null);
            const reorderNotes = (sourceId, targetId) => {
                if (!sourceId || sourceId === targetId) return;
                const sourceIndex = data.notes.findIndex(note => note.id === sourceId);
                const targetIndex = data.notes.findIndex(note => note.id === targetId);
                if (sourceIndex < 0 || targetIndex < 0) return;
                const notes = [...data.notes];
                const [moved] = notes.splice(sourceIndex, 1);
                notes.splice(targetIndex, 0, moved);
                setData({ ...data, notes });
                setRecentlyMovedNoteId(sourceId);
                setTimeout(() => setRecentlyMovedNoteId(null), 420);
            };
            
            // [V54 Change] Desktop Scroll functions
            const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });
            const scrollToBottom = () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            return (
                <div className="bg-gray-100 min-h-screen pb-12">
                    {/* [V54 Change] Sticky Top Navigation Bar */}
                    <div className="sticky top-0 z-50 bg-white/95 backdrop-blur supports-[backdrop-filter]:bg-white/60 shadow-sm border-b border-gray-200 px-6 py-3 no-print transition-all">
                        <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-2">
                                <span className="font-bold text-kino mr-2 hidden lg:inline">奇諾影像報價工作台</span>
                                {/* File Operations */}
                                <button onClick={handleOpen} className="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-1.5 px-3 text-sm rounded-lg transition flex items-center"><i className="fas fa-folder-open mr-1.5"></i>開啟</button>
                                <button onClick={handleSave} className="bg-kino hover:bg-kino-dark text-white font-bold py-1.5 px-3 text-sm rounded-lg transition flex items-center shadow-sm"><i className="fas fa-save mr-1.5"></i>儲存</button>
                                <button onClick={handleSaveAs} className="bg-kino-light hover:bg-kino-medium text-white font-bold py-1.5 px-3 text-sm rounded-lg transition flex items-center shadow-sm"><i className="fas fa-download mr-1.5"></i>另存</button>
                                <div className="w-px h-6 bg-gray-300 mx-1"></div>
                                {/* History */}
                                <button onClick={undo} disabled={!canUndo} className={`w-8 h-8 rounded-full flex items-center justify-center transition ${canUndo ? 'bg-gray-100 hover:bg-gray-200 text-gray-700' : 'text-gray-300 cursor-not-allowed'}`} title="復原"><i className="fas fa-undo text-sm"></i></button>
                                <button onClick={redo} disabled={!canRedo} className={`w-8 h-8 rounded-full flex items-center justify-center transition ${canRedo ? 'bg-gray-100 hover:bg-gray-200 text-gray-700' : 'text-gray-300 cursor-not-allowed'}`} title="重做"><i className="fas fa-redo text-sm"></i></button>
                                <button onClick={handleReset} className="delete-action ml-1" title="重置"><i className="fas fa-times"></i></button>
                            </div>

                            <div className="flex items-center gap-4">
                                <QuotationTypeSelector data={data} setData={setData} />
                                <ProjectLibraryControls projects={projectLibrary} onLoad={loadSavedProject} onSaveCurrent={saveCurrentProject} />
                                <label className="flex items-center space-x-1.5 cursor-pointer text-xs font-bold text-gray-600 hover:text-kino"><input type="checkbox" checked={data.printSettings.showSigDate} onChange={e => updateField('printSettings', 'showSigDate', e.target.checked)} className="accent-kino" /><span>簽署日期</span></label>
                            </div>
                        </div>
                    </div>

                    <div className="px-4 sm:px-8 desktop-wrapper relative">
                        <div className="max-w-5xl mx-auto mt-5">
                            <QuotationModeOverview data={data} onPrint={() => window.print()} />
                        </div>
                        {/* Desktop Scroll Buttons */}
                        <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 no-print">
                            <button onClick={scrollToTop} className="bg-kino text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center opacity-80 hover:opacity-100 transition"><i className="fas fa-arrow-up"></i></button>
                            <button onClick={scrollToBottom} className="bg-kino text-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center opacity-80 hover:opacity-100 transition"><i className="fas fa-arrow-down"></i></button>
                        </div>

                        <div className="max-w-5xl mx-auto bg-white rounded-xl shadow-2xl p-6 sm:p-10 page-container border border-gray-200 flex flex-col min-h-[calc(100vh-12rem)] mt-6">
                            <QuickPrintView data={data} calcs={calcs} />
                            <div className="standard-document-content flex-grow">
                                {/* [v1.08 Change] Header: Use Flexbox in print mode to prevent title overlapping/cutting */}
                                <div className="document-title-row flex items-center justify-between mb-4 border-b-4 border-kino pb-2 relative print:border-b-2">
                                    {/* Logo Column */}
                                    <div className="flex items-center group cursor-pointer relative flex-shrink-0" onClick={() => document.getElementById('d-logo-upload').click()}>
                                        {data.logo ? <img src={data.logo} className="max-h-[56px] max-w-[120px] object-contain" alt="Logo" /> : <div className="h-10 w-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-300 border-2 border-dashed border-gray-300 group-hover:bg-gray-200"><i className="fas fa-image"></i></div>}
                                        <input type="file" id="d-logo-upload" className="hidden" accept="image/*" onChange={handleLogoUpload} />
                                    </div>
                                    
                                    {/* Title Column - Grows to fill space */}
                                    <div className="flex-grow mx-4 text-center">
                                        {/* Screen Mode: Input */}
                                        <input 
                                            className="text-2xl font-extrabold text-gray-900 text-center bg-transparent focus:outline-none w-full no-print" 
                                            value={data.header.title || "奇諾影像報價單(Quotation)"} 
                                            onChange={e => updateField('header', 'title', e.target.value)} 
                                        />
                                        {/* [v1.08 Change] Print Mode: Div with wrap enabled to prevent cutting */}
                                        <div className="document-print-title print-only text-2xl font-extrabold text-gray-900 text-center whitespace-pre-wrap leading-tight">
                                            {data.header.title || "奇諾影像報價單(Quotation)"}
                                        </div>
                                        <div className="document-print-type print-only mt-1 text-[9pt] font-bold tracking-widest text-kino">
                                            {QUOTATION_TYPES[data.quotationType || 'quick'].label}
                                        </div>
                                    </div>

                                    {/* Empty Column for Balance (Screen only) */}
                                    <div className="w-[120px] flex-shrink-0 no-print"></div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 section-block print-header-info">
                                    <div className="flex flex-col"><label className="text-xs font-bold text-gray-700">報價單號：</label><input type="text" value={data.header.quotationId} onChange={e => updateField('header', 'quotationId', e.target.value)} className="font-bold text-kino border-b border-gray-300 focus:outline-none" /></div>
                                    <div className="flex flex-col"><label className="text-xs font-bold text-gray-700">報價日期：</label><input type="date" value={data.header.quotationDate} onChange={e => updateField('header', 'quotationDate', e.target.value)} className="border-b border-gray-300 focus:outline-none" /></div>
                                    <div className="flex flex-col"><label className="text-xs font-bold text-gray-700">有效期限：</label><input type="text" value={data.header.validity} onChange={e => updateField('header', 'validity', e.target.value)} className="text-red-600 border-b border-gray-300 focus:outline-none" /></div>
                                </div>
                                <div className="section-block quick-project-section">
                                    <div className="flex justify-between items-center mt-6 mb-2 border-l-4 border-kino pl-3"><h2 className="text-lg font-bold">一、 專案內容概況 (Project Overview)</h2><button className="no-print bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs rounded-full p-1 px-2" onClick={() => { const newProj = [...data.project, {label: "項目", value: ""}]; setData({...data, project: newProj}); }}><i className="fas fa-plus"></i></button></div>
                                    <div className="quick-project-grid mb-4 grid grid-cols-2 gap-x-6 gap-y-2 text-sm">{data.project.map((p, idx) => (<div key={idx} className="flex items-center gap-2 group relative"><input className="font-semibold text-gray-700 bg-transparent border-b w-1/3 text-right" value={p.label} onChange={e => { const newP = [...data.project]; newP[idx] = {...newP[idx], label: e.target.value}; setData({...data, project: newP}); }} /><span className="text-gray-500">：</span><input className="w-2/3 border-b border-gray-300" value={p.value} onChange={e => { const newP = [...data.project]; newP[idx] = {...newP[idx], value: e.target.value}; setData({...data, project: newP}); }} /><button className="delete-action no-print absolute right-0 opacity-0 group-hover:opacity-100" title="刪除項目" onClick={() => { const newP = data.project.filter((_, i) => i !== idx); setData({...data, project: newP}); }}><i className="fas fa-times"></i></button></div>))}</div>
                                </div>
                                <div className="section-block quick-summary-section">
                                    <div className="flex justify-between items-center mt-6 mb-2 border-l-4 border-kino pl-3"><h2 className="text-lg font-bold">二、 專案報價 (Quotation Summary)</h2><button className="no-print bg-gray-200 text-xs px-2 py-1 rounded-full" onClick={() => { const id = generateId(); setData({ ...data, categories: [...data.categories, {id, name: "新摘要", summaryQty: '', summaryUnit: ''}], items: {...data.items, [id]: []} }); }}><i className="fas fa-plus mr-1"></i>新增摘要</button></div>
                                    <div className="print-table-container border border-gray-300 rounded-lg overflow-hidden mb-4 shadow-sm">

            const [draggingIdx, setDraggingIdx] = useState(null); 
            // [v1.08 Change] Animation Lock to prevent double-click race conditions
            const [isAnimating, setIsAnimating] = useState(false);

            const scrollTo = (id) => { 
                const el = document.getElementById(id); 
                if (el) { 
                    const headerOffset = 80; 
                    const elementPosition = el.getBoundingClientRect().top; 
                    const offsetPosition = elementPosition + window.pageYOffset - headerOffset; 
                    window.scrollTo({ top: offsetPosition, behavior: "smooth" }); 
                } 
            };
            const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });
            const scrollToBottom = () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            
            // [v1.08 Change] Enhanced moveNote with Visual Animation
            const moveNote = async (index, direction) => {
                if (isAnimating) return; // Block interactions during animation
                if ((direction === 'up' && index === 0) || (direction === 'down' && index === data.notes.length - 1)) return;

                const targetIndex = direction === 'up' ? index - 1 : index + 1;
                
                // Visual Swap Animation Logic
                const currentEl = document.querySelector(`[data-note-index="${index}"]`);
                const targetEl = document.querySelector(`[data-note-index="${targetIndex}"]`);

                if (currentEl && targetEl) {
                    setIsAnimating(true);
                    
                    // Enable transitions
                    currentEl.style.transition = 'transform 0.25s ease-in-out';
                    targetEl.style.transition = 'transform 0.25s ease-in-out';
                    
                    // Calculate visual offset
                    const currentRect = currentEl.getBoundingClientRect();
                    const targetRect = targetEl.getBoundingClientRect();
                    const deltaY = targetRect.y - currentRect.y;

                    // Apply visual move
                    currentEl.style.transform = `translateY(${deltaY}px)`;
                    targetEl.style.transform = `translateY(${-deltaY}px)`; // Move target opposite way

                    // Wait for animation to finish
                    await new Promise(r => setTimeout(r, 250));

                    // Cleanup Styles
                    currentEl.style.transition = '';
                    currentEl.style.transform = '';
                    targetEl.style.transition = '';
                    targetEl.style.transform = '';
                }

                // Perform Actual Data Swap
                const newNotes = [...data.notes];
                if (direction === 'up') {
                    [newNotes[index], newNotes[index - 1]] = [newNotes[index - 1], newNotes[index]]; 
                } else {
                    [newNotes[index], newNotes[index + 1]] = [newNotes[index + 1], newNotes[index]]; 
                }
                setData({...data, notes: newNotes});
                
                setIsAnimating(false);
            };

            // [v1.16 Change] Unified Drag & Drop Logic for Mobile (Touch) and Desktop (Mouse) with Boundary Checks
            const performDragSwap = useCallback((clientY) => {
                if (draggingIdx === null) return;
                
                const cards = document.querySelectorAll('[data-note-index]');
                for (let card of cards) {
                    const rect = card.getBoundingClientRect();
                    if (clientY >= rect.top && clientY <= rect.bottom) {
                        const targetIdx = parseInt(card.dataset.noteIndex);
                        
                        // Added safe boundary checks to prevent errors
                        if (!isNaN(targetIdx) && targetIdx !== draggingIdx && targetIdx >= 0 && targetIdx < data.notes.length) {
                             const newNotes = [...data.notes];
                             
                             // Safety check for splice
                             if (draggingIdx < 0 || draggingIdx >= newNotes.length) break;

                             const [removed] = newNotes.splice(draggingIdx, 1);
                             newNotes.splice(targetIdx, 0, removed);
                             
                             setData({...data, notes: newNotes});
                             setDraggingIdx(targetIdx); 
                             break;
                        }
                    }
                }
            }, [draggingIdx, data.notes, setData]);

            const handleTouchStart = (e, index) => { 
                if(e.cancelable) e.preventDefault();
                setDraggingIdx(index); 
                document.body.style.overflow = 'hidden'; 
            };
            
            const handleTouchMove = (e) => {
                if (draggingIdx === null) return;
                if(e.cancelable) e.preventDefault(); 
                performDragSwap(e.touches[0].clientY);
            };

            const handleTouchEnd = () => { 
                setDraggingIdx(null); 
                document.body.style.overflow = ''; 
            };

            // [v1.16 Change] Desktop Mouse Handlers
            const handleMouseDown = (e, index) => {
                e.preventDefault();
                e.stopPropagation();
                setDraggingIdx(index);
                document.body.style.userSelect = 'none';
                document.body.style.cursor = 'grabbing';
            };

            useEffect(() => {
                if (draggingIdx === null) return;

                const handleWindowMouseMove = (e) => {
                    e.preventDefault();
                    performDragSwap(e.clientY);
                };

                const handleWindowMouseUp = () => {
                    setDraggingIdx(null);
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                };

                window.addEventListener('mousemove', handleWindowMouseMove);
                window.addEventListener('mouseup', handleWindowMouseUp);

                return () => {
                    window.removeEventListener('mousemove', handleWindowMouseMove);
                    window.removeEventListener('mouseup', handleWindowMouseUp);
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                };
            }, [draggingIdx, performDragSwap]);

            return (
                <div className="bg-gray-100 min-h-screen pb-20 relative sm:max-w-[480px] sm:mx-auto sm:shadow-2xl sm:border-x sm:border-gray-200 sm:min-h-screen">
                    <div className="fixed bottom-20 left-0 right-0 z-50 w-full sm:max-w-[480px] mx-auto pointer-events-none no-print">
                        <div className="absolute right-4 bottom-0 flex flex-col gap-2 pointer-events-auto">
                            <button onClick={scrollToTop} className="bg-kino text-white w-8 h-8 rounded-full shadow-lg flex items-center justify-center opacity-80 hover:opacity-100 transition"><i className="fas fa-arrow-up text-xs"></i></button>
                            <button onClick={scrollToBottom} className="bg-kino text-white w-8 h-8 rounded-full shadow-lg flex items-center justify-center opacity-80 hover:opacity-100 transition"><i className="fas fa-arrow-down text-xs"></i></button>
                        </div>
                    </div>

                    <div className="sticky top-0 z-40 bg-white shadow-md">

                            <div className="flex items-center gap-2">
                                <button onClick={handleSave} className="text-kino p-2 rounded hover:bg-gray-100"><i className="fas fa-save fa-lg"></i></button>
                                <button onClick={handleOpen} className="text-kino p-2 rounded hover:bg-gray-100 cursor-pointer"><i className="fas fa-folder-open fa-lg"></i></button>
                                <button onClick={handleReset} className="text-red-500 p-2 rounded hover:bg-gray-100"><i className="fas fa-undo fa-lg"></i></button>
                                <div className="w-px h-6 bg-gray-300 mx-1"></div>
                            </div>
                        </div>
                        <div className="px-3 pb-3">
                            <QuotationTypeSelector data={data} setData={setData} />
                            <div className="mt-2"><ProjectLibraryControls projects={projectLibrary} onLoad={loadSavedProject} onSaveCurrent={saveCurrentProject} compact={true} /></div>
                        </div>
                    </div>
                    <div className="p-4 space-y-6">
                        <QuotationModeOverview data={data} onPrint={() => window.print()} compact={true} />
                        <div id="m-header" className="bg-white p-4 rounded-xl shadow-sm space-y-4 mobile-section">
                            <h2 className="text-kino font-bold border-b pb-2"><i className="fas fa-info-circle mr-2"></i>專案概況</h2>
                            <div className="flex flex-col items-center justify-center py-2 border-b border-gray-100"><label className="text-xs text-gray-500 mb-2">品牌標誌</label><div className="w-full flex justify-center cursor-pointer" onClick={() => document.getElementById('m-logo-upload').click()}>{data.logo ? (<img src={data.logo} className="max-h-[80px] object-contain" />) : (<div className="h-16 w-full bg-gray-50 border-2 border-dashed border-gray-300 rounded flex items-center justify-center text-gray-400"><i className="fas fa-image mr-2"></i> 點擊上傳</div>)}</div><input type="file" id="m-logo-upload" className="hidden" accept="image/*" onChange={async e => { if(e.target.files[0]) { const b64 = await compressImage(e.target.files[0]); setData({...data, logo: b64}); } }} /></div>
                            <div className="grid grid-cols-1 gap-3"><div><label className="text-xs text-gray-500 block">單號</label><input type="text" value={data.header.quotationId} onChange={e => updateField('header', 'quotationId', e.target.value)} className="w-full font-bold text-lg border-b border-gray-300 py-1" /></div><div className="grid grid-cols-2 gap-3"><div><label className="text-xs text-gray-500 block">日期</label><input type="date" value={data.header.quotationDate} onChange={e => updateField('header', 'quotationDate', e.target.value)} className="w-full border-b py-1" /></div><div><label className="text-xs text-gray-500 block">效期</label><input type="text" value={data.header.validity} onChange={e => updateField('header', 'validity', e.target.value)} className="w-full border-b py-1 text-red-500" /></div></div></div>
                            <div className="space-y-2 mt-4"><div className="flex justify-between items-center"><span className="text-sm font-bold text-gray-700">專案資訊</span><button className="bg-gray-100 px-2 py-1 rounded text-xs text-kino hover:bg-gray-200" onClick={() => setData({...data, project: [...data.project, {label: "項目", value: ""}]})}><i className="fas fa-plus"></i></button></div>{data.project.map((p, i) => (<div key={i} className="flex gap-2 items-center"><input className="w-1/3 bg-gray-50 rounded px-2 py-1 text-xs" value={p.label} onChange={e => { const newP = [...data.project]; newP[i] = {...newP[i], label: e.target.value}; setData({...data, project: newP}); }} /><input className="w-full border-b border-gray-200 px-2 py-1 text-sm" value={p.value} onChange={e => { const newP = [...data.project]; newP[i] = {...newP[i], value: e.target.value}; setData({...data, project: newP}); }} /><button className="delete-action" title="刪除項目" onClick={() => { const newP = data.project.filter((_, idx) => idx !== i); setData({...data, project: newP}); }}><i className="fas fa-times"></i></button></div>))}</div>
                        </div>
                        <div id="m-summary" className="bg-white p-4 rounded-xl shadow-sm space-y-3 mobile-section">
                             <div className="flex justify-between items-center border-b pb-2"><h2 className="text-kino font-bold"><i className="fas fa-calculator mr-2"></i>報價摘要</h2><button className="bg-kino-light text-white text-xs px-2 py-1 rounded shadow" onClick={() => { const id = generateId(); setData({...data, categories: [...data.categories, {id, name: "新分類", summaryQty: '', summaryUnit: ''}], items: {...data.items, [id]: []}}); }}><i className="fas fa-plus"></i> 分類</button></div>
                             <div className="space-y-2">{data.categories.map(cat => {
                                 const sectionTotal = (data.items[cat.id] || []).reduce((acc, item) => acc + (item.qty * item.price), 0);
                                 return (<div key={cat.id} className="space-y-1 border-b border-gray-50 pb-2">
                                     <div className="flex items-center gap-2 text-sm">
                                         <input className="text-gray-600 flex-1 min-w-0 bg-transparent font-medium focus:text-gray-900" value={cat.name} onChange={e => { const newC = data.categories.map(c => c.id === cat.id ? {...c, name: e.target.value} : c); setData({...data, categories: newC}); }} />
                                         <span className="font-bold whitespace-nowrap">{formatCurrency(sectionTotal)}</span>
                                         <button className="delete-action" title="刪除摘要" onClick={() => { if(confirm("確認刪除此分類？")) { const newC = data.categories.filter(c => c.id !== cat.id); const newI = {...data.items}; delete newI[cat.id]; setData({...data, categories: newC, items: newI}); } }}><i className="fas fa-times"></i></button>
                                     </div>
                                     <div className="flex justify-end gap-2">
                                         <input type="number" min="0" placeholder="數量" aria-label={`${cat.name} 數量`} value={cat.summaryQty ?? ''} onChange={e => { const newC = data.categories.map(c => c.id === cat.id ? {...c, summaryQty: e.target.value} : c); setData({...data, categories: newC}); }} className="w-20 rounded border border-gray-200 px-2 py-1 text-xs text-center" />
                                         <input placeholder="單位" aria-label={`${cat.name} 單位`} value={cat.summaryUnit ?? ''} onChange={e => { const newC = data.categories.map(c => c.id === cat.id ? {...c, summaryUnit: e.target.value} : c); setData({...data, categories: newC}); }} className="w-20 rounded border border-gray-200 px-2 py-1 text-xs text-center" />

                            <div className="bg-kino text-white rounded-lg p-3 shadow mt-3"><div className="flex justify-between text-xs opacity-80 mb-1"><span>未稅總計</span><span>{formatCurrency(calcs.totalA)}</span></div><div className="flex justify-between items-center border-t border-white/20 pt-2"><select value={data.taxMode} onChange={e => setData({...data, taxMode: e.target.value})} className="text-black text-xs rounded px-1 py-1"><option value="excluded">未稅</option><option value="inclusive_flat">含稅(內含)</option><option value="included">稅外(5%)</option></select><span className="text-2xl font-bold">{formatCurrency(calcs.grandTotal)}</span></div></div>

                        <div id="m-notes" className="mobile-section">

                                {data.notes.map((note, i) => (

                                        <div className="flex justify-between items-center mb-2 pb-2 border-b border-gray-100">
                                            <div className="flex items-center gap-2 text-gray-500 font-bold select-none">
                                                <div 
                                                    className="cursor-move p-2 -ml-2 text-gray-400 hover:text-kino active:text-kino"
                                                    style={{ touchAction: 'none' }} 
                                                    onTouchStart={(e) => handleTouchStart(e, i)}
                                                    onTouchMove={handleTouchMove}
                                                    onTouchEnd={handleTouchEnd}
                                                    onMouseDown={(e) => handleMouseDown(e, i)}
                                                >
                                                    <i className="fas fa-bars fa-lg"></i>
                                                </div>
                                                <span className="text-kino text-lg mr-2">{i + 1}.</span>
                                                <div className="flex gap-1 no-print">
                                                    <button className={`w-6 h-6 rounded-full flex items-center justify-center ${i===0 ? 'bg-gray-100 text-gray-300' : 'bg-gray-200 text-gray-600'} hover:bg-kino hover:text-white transition-colors`} onClick={() => moveNote(i, 'up')} disabled={i===0}><i className="fas fa-chevron-up text-xs"></i></button>
                                                    <button className={`w-6 h-6 rounded-full flex items-center justify-center ${i===data.notes.length-1 ? 'bg-gray-100 text-gray-300' : 'bg-gray-200 text-gray-600'} hover:bg-kino hover:text-white transition-colors`} onClick={() => moveNote(i, 'down')} disabled={i===data.notes.length-1}><i className="fas fa-chevron-down text-xs"></i></button>
                                                </div>
                                            </div>
                                            <button className="delete-action" title="刪除條款" onClick={() => { const newNotes = data.notes.filter((_, idx) => idx !== i); setData({...data, notes: newNotes}); }}><i className="fas fa-times"></i></button>
                                        </div>
                                        <AutoResizeTextarea mode={mode} value={note.text} placeholder="輸入條款內容…" onChange={e => { const newNotes = [...data.notes]; newNotes[i] = {...newNotes[i], text: e.target.value}; setData({...data, notes: newNotes}); }} className="w-full text-sm text-gray-700 bg-transparent border-none resize-none focus:ring-0 p-0 leading-relaxed" />
                                    </div>
                                ))}
                                <button className="w-full py-3 bg-white border border-dashed border-gray-300 text-gray-500 rounded-xl hover:bg-gray-50 font-medium" onClick={() => { setData({...data, notes: [...data.notes, { id: generateId(), text: "" }]}); }}>+ 新增條款</button>
                            </div>
                        </div>
                        <div id="m-payment" className="mobile-section">
                            <div className="flex justify-between items-center mb-2"><h2 className="text-kino font-bold text-lg">付款條件</h2><PaymentTemplateSelect onApply={applyPaymentTemplate} compact={true} /></div>
                            <div className="space-y-3">
                                {data.payment.terms.map((term, i) => (
                                    <div 
                                        key={i} 
                                        className="bg-white p-3 rounded-xl shadow-sm relative border border-transparent"
                                    >
                                        <div className="flex justify-between mb-2">
                                            <input className="font-bold w-1/2 border-b border-transparent focus:border-kino" placeholder="階段" value={term.phase} onChange={e => { const newT = [...data.payment.terms]; newT[i] = {...newT[i], phase: e.target.value}; setData({...data, payment: {terms: newT}}); }} />
                                            <input className="font-bold text-kino text-right w-1/4 border-b border-transparent focus:border-kino" placeholder="比例" value={term.percent} onChange={e => { const newT = [...data.payment.terms]; newT[i] = {...newT[i], percent: e.target.value}; setData({...data, payment: {terms: newT}}); }} />
                                        </div>
                                        <input className="w-full text-sm text-gray-600 mb-1 border-b border-gray-100 pb-1" placeholder="條件..." value={term.condition} onChange={e => { const newT = [...data.payment.terms]; newT[i] = {...newT[i], condition: e.target.value}; setData({...data, payment: {terms: newT}}); }} />
                                        <input className="w-full text-xs text-gray-400" placeholder="備註..." value={term.notes} onChange={e => { const newT = [...data.payment.terms]; newT[i] = {...newT[i], notes: e.target.value}; setData({...data, payment: {terms: newT}}); }} />
                                        <button className="delete-action absolute -top-2 -right-2 bg-white shadow-sm" title="刪除付款期別" onClick={() => { const newT = data.payment.terms.filter((_, idx) => idx !== i); setData({...data, payment: {terms: newT}}); }}><i className="fas fa-times text-xs"></i></button>
                                    </div>
                                ))}
                                <button className="w-full py-3 bg-white border border-dashed border-gray-300 text-gray-500 rounded-xl hover:bg-gray-50 font-medium" onClick={() => { setData({...data, payment: {terms: [...data.payment.terms, {phase: "", percent: "", condition: "", notes: ""}]}}); }}>+ 新增款項</button>

                        </div>
                        <div id="m-signature" className="bg-white p-4 rounded-xl shadow-sm mobile-section">
                            <h2 className="text-kino font-bold text-lg mb-4">報價簽署</h2>

                                    <div className="grid grid-cols-2 gap-3">

                                </div>

                        <div id="m-details" className={`space-y-4 p-4 rounded-2xl border mobile-section ${data.quotationType === 'detailed' ? 'border-kino/30 bg-kino/5' : 'border-amber-200 bg-amber-50/60'}`}>
                            <div className="flex justify-between items-center"><h2 className="text-kino font-bold text-lg">服務細項報價</h2><button className="bg-kino text-white text-xs px-3 py-1 rounded-full shadow" onClick={() => { const id = generateId(); setData({...data, categories: [...data.categories, {id, name: "新分類"}], items: {...data.items, [id]: []}}); }}>+ 分類</button></div>
                            <p className="text-xs text-gray-500 -mt-2">{QUOTATION_TYPES[data.quotationType || 'quick'].editorHint}</p>
                            {data.categories.map((cat, idx) => { const sectionTotal = (data.items[cat.id] || []).reduce((acc, item) => acc + (item.qty * item.price), 0); return (<div key={cat.id} className="bg-white rounded-xl shadow-sm overflow-hidden"><div className="bg-kino-light p-3 flex justify-between items-center text-white"><input className="bg-transparent font-bold w-2/3 focus:outline-none" value={cat.name} onChange={e => { const newC = data.categories.map(c => c.id === cat.id ? {...c, name: e.target.value} : c); setData({...data, categories: newC}); }} /><div className="text-xs">{formatCurrency(sectionTotal)}</div></div><div className="p-3 space-y-3">{(data.items[cat.id] || []).map((item, i) => (<div key={i} className="bg-gray-50 rounded-lg p-3 relative border border-gray-100"><input className="w-full font-medium text-gray-800 mb-2 bg-transparent border-b border-dashed border-gray-300 focus:outline-none pb-1" value={item.desc} placeholder="項目描述" onChange={e => { const newItems = [...data.items[cat.id]]; newItems[i].desc = e.target.value; setData({...data, items: {...data.items, [cat.id]: newItems}}); }} /><div className="flex gap-2 mb-2"><div className="w-1/3"><label className="text-[10px] text-gray-500">單價</label><input type="number" className="w-full text-sm font-bold text-gray-700 bg-white rounded border border-gray-200 px-1" value={item.price} onChange={e => { const newItems = [...data.items[cat.id]]; newItems[i].price = parseInt(e.target.value)||0; setData({...data, items: {...data.items, [cat.id]: newItems}}); }} /></div><div className="w-1/4"><label className="text-[10px] text-gray-500">數量</label><input type="number" className="w-full text-sm text-center bg-white rounded border border-gray-200 px-1" value={item.qty} onChange={e => { const newItems = [...data.items[cat.id]]; newItems[i].qty = parseInt(e.target.value)||0; setData({...data, items: {...data.items, [cat.id]: newItems}}); }} /></div><div className="w-1/4"><label className="text-[10px] text-gray-500">單位</label><input className="w-full text-sm text-center bg-white rounded border border-gray-200 px-1" value={item.unit} onChange={e => { const newItems = [...data.items[cat.id]]; newItems[i].unit = e.target.value; setData({...data, items: {...data.items, [cat.id]: newItems}}); }} /></div></div><div className="flex justify-between items-end border-t border-gray-200 pt-2 mt-2"><span className="text-xs text-gray-400">小計: {formatCurrency(item.qty * item.price)}</span><button className="text-red-400 p-1" onClick={() => { const newItems = data.items[cat.id].filter((_, index) => index !== i); setData({...data, items: {...data.items, [cat.id]: newItems}}); }}><i className="fas fa-trash"></i></button></div></div>))}<button className="w-full py-2 bg-gray-100 text-gray-500 text-xs rounded-lg font-bold hover:bg-gray-200" onClick={() => { const newItems = [...(data.items[cat.id] || []), {desc: "新項目", qty: 1, unit: "式", price: 0}]; setData({...data, items: {...data.items, [cat.id]: newItems}}); }}>+ 新增項目</button></div></div>)})}
                        </div>
                        <div id="m-print" className="bg-gray-800 text-white p-4 rounded-xl shadow-lg mt-8 mobile-section">
                            <h2 className="font-bold border-b border-gray-600 pb-2 mb-3"><i className="fas fa-print mr-2"></i>列印與輸出設定</h2>
                            <QuotationTypeSelector data={data} setData={setData} compact={true} />
                            <label className="flex items-center space-x-2 text-sm select-none cursor-pointer my-4"><input type="checkbox" checked={data.printSettings.showSigDate} onChange={e => updateField('printSettings', 'showSigDate', e.target.checked)} className="text-kino" /><span>包含簽署日期</span></label>
                            <button onClick={() => window.print()} className="w-full bg-white text-gray-900 font-bold py-3 rounded-lg hover:bg-gray-200 transition">列印／另存 PDF</button>
                            <p className="text-xs text-gray-400 mt-2 text-center">快速報價固定單頁。</p>
                        </div>
                        <div className="h-20"></div>
                    </div>
                </div>
            );
        };
